<script>
"use strict";

/* ══════════════════════════════════════════════════════════════
   /domain — statusEngine
   ONE evaluation returns the whole state object. Label, colour and
   action ownership never diverge because they are never derived
   separately.
   ══════════════════════════════════════════════════════════════ */
const CODE = {NA:0, ACTION:1, PENDING:2, DONE:3, INFO:4};

const S = {
  NOT_APPLICABLE:      {code:CODE.NA,      label:"Not applicable",   owner:null,       act:false},
  NOT_DUE:             {code:CODE.INFO,    label:"Not due",          owner:"Facility", act:false},
  PENDING_VALIDATION:  {code:CODE.INFO,    label:"Informational",    owner:"Admin",    act:false},
  OVERDUE:             {code:CODE.ACTION,  label:"Overdue",          owner:"Facility", act:true},
  NOT_SATISFIED:       {code:CODE.PENDING, label:"Not satisfied",    owner:"Facility", act:true},
  CORRECTION_REQUIRED: {code:CODE.PENDING, label:"Correction needed",owner:"Facility", act:true},
  RECEIVED_PENDING_QC: {code:CODE.PENDING, label:"Awaiting review",  owner:"Reviewer", act:true},
  ACCEPTED:            {code:CODE.DONE,    label:"Accepted",         owner:null,       act:false}
};

function itemStatus(it, req, today, currentQC){
  const mk = k => Object.assign({status:k}, S[k]);

  if (it.Waived_Flag || !it.Required_Flag) return mk("NOT_APPLICABLE");

  // A provisional requirement is informational, never adverse.
  if (req.Authority_Status === "UNVERIFIED" && !it.Received_Flag) return mk("PENDING_VALIDATION");

  const qc = currentQC;
  if (qc === "Accepted")            return mk("ACCEPTED");
  if (qc === "Not Applicable")      return mk("NOT_APPLICABLE");
  if (qc === "Correction Required") return mk("CORRECTION_REQUIRED");

  // Wrong document means the requirement is still UNMET. Whether that is
  // urgent depends on the suspense, not on the QC verdict.
  if (qc === "Wrong Document")
    return today > it.Due_Date ? mk("OVERDUE") : mk("NOT_SATISFIED");

  if (it.Received_Flag)             return mk("RECEIVED_PENDING_QC");
  return today <= it.Due_Date ? mk("NOT_DUE") : mk("OVERDUE");
}

/* Package state is computed from semantic statuses, not from colour codes.
   [ACCEPTED, NOT_DUE, NOT_DUE] is IN PROGRESS, not COMPLETE. */
const PKG = {
  ACTION_REQUIRED:{code:CODE.ACTION,  label:"Action required"},
  IN_REVIEW:      {code:CODE.PENDING, label:"In review"},
  COMPLETE:       {code:CODE.DONE,    label:"Complete"},
  IN_PROGRESS:    {code:CODE.INFO,    label:"In progress"},
  NOT_APPLICABLE: {code:CODE.NA,      label:"Nothing due"}
};
function packageState(states){
  const has = k => states.some(s=>s.status===k);
  const applicable = states.filter(s=>s.status!=="NOT_APPLICABLE");
  if (!applicable.length) return Object.assign({state:"NOT_APPLICABLE"}, PKG.NOT_APPLICABLE);
  if (has("OVERDUE") || has("CORRECTION_REQUIRED") || has("NOT_SATISFIED"))
    return Object.assign({state:"ACTION_REQUIRED"}, PKG.ACTION_REQUIRED);
  if (has("RECEIVED_PENDING_QC")) return Object.assign({state:"IN_REVIEW"}, PKG.IN_REVIEW);
  const real = applicable.filter(s=>s.status!=="PENDING_VALIDATION");
  if (real.length && real.every(s=>s.status==="ACCEPTED"))
    return Object.assign({state:"COMPLETE"}, PKG.COMPLETE);
  return Object.assign({state:"IN_PROGRESS"}, PKG.IN_PROGRESS);
}

/* ══════════════════════════════════════════════════════════════
   /domain — dateUtil
   Reporting_Period is YYYY-MM. Dates are YYYY-MM-DD. Datetimes carry a
   time part. Parse before comparing so a timestamp never leaks into a
   day number.
   ══════════════════════════════════════════════════════════════ */
const D = {
  day: v => (v||"").slice(0,10),
  before: (a,b) => D.day(a) <= D.day(b),
  after:  (a,b) => D.day(a) >  D.day(b),
  fmt(v){
    const d = D.day(v); if(!d) return "—";
    const [y,m,dd] = d.split("-");
    return `${+dd} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m-1]}`;
  },
  fmtLong(v){ const d=D.day(v); return d ? D.fmt(d)+" "+d.slice(0,4) : "—"; },
  period(p){
    const [y,m] = p.split("-");
    return `${["January","February","March","April","May","June","July","August",
      "September","October","November","December"][+m-1]} ${y}`;
  },
  daysBetween(a,b){ return Math.round((new Date(D.day(b))-new Date(D.day(a)))/864e5); }
};

/* ══════════════════════════════════════════════════════════════

const REQUIREMENTS = [

/* ══════════════════════════════════════════════════════════════
   /domain — requirementEngine (EOM-01)
   ══════════════════════════════════════════════════════════════ */
function matchesReq(f, r){
  return (f.Operating_Model===r.Applicable_Model || r.Applicable_Model==="All") &&
    (!r.Applicable_Facility_Types || r.Applicable_Facility_Types.split(";").includes(f.Facility_Type));
}
function generateItems(period){
  const out=[], due = d => `${period.slice(0,4)}-09-${String(d).padStart(2,"0")}`;
  const key = (iid,fid,cid,code) =>
    `${inst(iid).Installation_Name.toUpperCase()}|${fid?fac(fid).Facility_Name.replace(/\s/g,"").toUpperCase():(cid||"INST")}|${period}|${code}`;
  REQUIREMENTS.filter(r=>r.Active_Flag).forEach(r=>{
    if (r.Requirement_Scope==="Facility"){
      FACILITIES.filter(f=>matchesReq(f,r)).forEach(f=>out.push(mkItem(f.Installation_ID,f.Facility_ID,null,r)));
    } else if (r.Requirement_Scope==="Installation"){
      INSTALLATIONS.filter(i=>FACILITIES.some(f=>f.Installation_ID===i.Installation_ID&&matchesReq(f,r)))
        .forEach(i=>out.push(mkItem(i.Installation_ID,null,null,r)));
    } else {
      const seen=new Set();
      FACILITIES.filter(f=>matchesReq(f,r)&&f.Contract_ID).forEach(f=>{
        if(seen.has(f.Contract_ID))return; seen.add(f.Contract_ID);
        out.push(mkItem(f.Installation_ID,null,f.Contract_ID,r));
      });
    }
  });
  function mkItem(iid,fid,cid,r){
    return {EOM_Item_ID:`${period}|${fid||cid||iid}|${r.Requirement_ID}`,
      EOM_Item_Key:key(iid,fid,cid,r.Document_Code),
      Portfolio_ID:inst(iid).Portfolio_ID, Installation_ID:iid, Facility_ID:fid, Contract_ID:cid,
      Reporting_Period:period, Requirement_ID:r.Requirement_ID,
      Requirement_Scope:r.Requirement_Scope, Required_Flag:r.Required_Flag,
      Due_Date:due(r.Due_Day), Received_Flag:false, Waived_Flag:false,
      Current_Submission_ID:null, Correction_Due:null};
  }
  return out;
}

/* Configuration health — a facility with no matching requirement set would
   otherwise show an empty package and look compliant. */
function configHealth(){
  const orphans = FACILITIES.filter(f=>!REQUIREMENTS.some(r=>r.Active_Flag && matchesReq(f,r)));
  return {
    installations: INSTALLATIONS.length,
    facilities: FACILITIES.length,
    orphans,
    unmatched: DB.unmatched.filter(u=>u.Resolution_Status==="Needs Classification").length,
    dupCurrent: 0,
    generated: DB.items.filter(i=>i.Reporting_Period===PERIOD).length
  };
}

/* ══════════════════════════════════════════════════════════════
   /domain — securityEngine
   A facility user's rollup must NOT include sibling facilities, and a
   contract item is only theirs if the contract covers their facility.
   ══════════════════════════════════════════════════════════════ */
function visibleFacilities(){
  if (ME.Scope_Type==="Facility") return FACILITIES.filter(f=>f.Facility_ID===ME.Facility_ID);
  if (ME.Scope_Type==="Installation") return FACILITIES.filter(f=>f.Installation_ID===ME.Installation_ID);
  if (ME.Scope_Type==="Portfolio")
    return FACILITIES.filter(f=>inst(f.Installation_ID).Portfolio_ID===ME.Portfolio_ID);
  return FACILITIES;
}
function visibleInstallations(){
  if (ME.Scope_Type==="Enterprise") return INSTALLATIONS;
  if (ME.Scope_Type==="Portfolio") return INSTALLATIONS.filter(i=>i.Portfolio_ID===ME.Portfolio_ID);
  return INSTALLATIONS.filter(i=>i.Installation_ID===ME.Installation_ID);
}
function canSeeItem(it){
  const fids = visibleFacilities().map(f=>f.Facility_ID);
  if (it.Facility_ID) return fids.includes(it.Facility_ID);
  if (it.Contract_ID)
    return FACILITIES.some(f=>fids.includes(f.Facility_ID) && f.Contract_ID===it.Contract_ID);
  return visibleInstallations().some(i=>i.Installation_ID===it.Installation_ID);
}
function visibleItems(period){
  return DB.items.filter(it=>it.Reporting_Period===(period||PERIOD) && canSeeItem(it));
}
/* Rollup is always over what the viewer may see. A facility user's
   installation figure is their slice, never the whole base. */
function rollupFor(items){ return packageState(items.map(st)); }
function installationState(iid){
  return rollupFor(visibleItems().filter(i=>i.Installation_ID===iid));
}
function facilityState(fid){
  return rollupFor(visibleItems().filter(i=>i.Facility_ID===fid));
}

/* action ownership: is this mine, or am I waiting on someone else? */
function isMyAction(it){
  const s = st(it);
  if (!s.act) return false;
  if (s.owner==="Reviewer") return ME.Can_QC;
  if (s.owner==="Facility")
    return ME.Scope_Type==="Facility" || ME.Scope_Type==="Installation" || ME.Can_Submit_On_Behalf;
  return false;
}

    Uploaded_By:opts.by||ME.Name, Uploaded_DateTime:opts.when||TODAY,
    Submitted_On_Behalf_Of:opts.onBehalf||"", Intake_Method:opts.method||"App upload",

    QC_By:opts.qcBy||"", QC_DateTime:opts.qcWhen||"", QC_Comment:opts.comment||""});

        ${chip(facilityState(f.Facility_ID))}</div></div>`).join("")}
  </div>
  <div class="card"><header><h2>Installation and contract items</h2></header>
    ${recordList(direct, {empty:"None for this period."})}</div>`;
}

/* ---------- Review ---------- */
function viewReview(){
  if (!SEL.item){
    const q = visibleItems().filter(i=>st(i).status==="RECEIVED_PENDING_QC")
      .sort((a,b)=>a.Due_Date.localeCompare(b.Due_Date));
    return `<div class="card"><header><h2>Review queue</h2>
      <span class="sub">${q.length} awaiting your decision</span></header>
      ${recordList(q, {showLocation:true, empty:"The queue is clear."})}</div>`;
  }
  const it = DB.items.find(i=>i.EOM_Item_ID===SEL.item);
  const r = rq(it.Requirement_ID), s = st(it);
  const vs = DB.subs.filter(x=>x.EOM_Item_ID===it.EOM_Item_ID).sort((a,b)=>b.Version_No-a.Version_No);
  const cur = vs.find(v=>v.Is_Current);
  const prevComment = vs.find(v=>v.QC_Comment);

  return `<div class="card">
    <header><button class="btn sm" data-act="back">← Back</button>
      <h2 style="margin-left:6px">${esc(r.Document_Code)}</h2>
      <span class="sub">${esc(inst(it.Installation_ID).Installation_Name)} · ${esc(where(it))} · ${D.period(PERIOD)}</span>
      <div class="right">${chip(s)}</div></header>
    <div class="pad grid2">
      <div class="stack-md">
        <div style="border:1px solid var(--line);border-radius:6px;padding:15px;background:#fbfcfd">
          <div class="section-title">Document</div>
          <div style="font-size:15px;font-weight:600;word-break:break-all">${esc(cur?cur.File_Name:"Not received")}</div>
          <div class="meta" style="margin:5px 0 12px">
            ${cur?`Submitted ${D.fmtLong(cur.Uploaded_DateTime)} by ${esc(cur.Uploaded_By)}`:""}
            ${cur&&cur.Submitted_On_Behalf_Of?`<br>on behalf of ${esc(cur.Submitted_On_Behalf_Of)}`:""}
          </div>
          <button class="btn">Open document</button>
        </div>
        <div>
          <div class="section-title">Requirement</div>
          <div class="meta">${esc(r.Document_Name)}<br>
            Due ${D.fmtLong(it.Due_Date)} · ${it.Requirement_Scope} scope</div>
        </div>
        <div>
          <div class="section-title">Versions</div>
          <div style="border:1px solid var(--line);border-radius:6px;padding:2px 12px">
            ${vs.map(v=>`<div class="ver ${v.Is_Current?"cur":""}"><span class="vn">v${v.Version_No}</span>
              <span style="flex:1">${esc(v.File_Name)}
                <div class="meta">${D.fmt(v.Uploaded_DateTime)} · ${esc(v.Uploaded_By)}</div></span>
              <span class="meta">${esc(v.QC_Status)}</span></div>`).join("")}
          </div>
        </div>
        ${prevComment?`<div class="warn-box"><b>Previous comment:</b> ${esc(prevComment.QC_Comment)}</div>`:""}
      </div>

      <div class="stack-md">
        <div><div class="section-title">Decision</div>
          <div class="radios">
            ${[["Accepted","Accept"],["Correction Required","Return for correction"],
               ["Wrong Document","Wrong document"],["Not Applicable","Not applicable"]]
              .map(([v,l])=>`<label><input type="radio" name="qc" value="${v}" data-act="qcpick">
                <span>${l}</span></label>`).join("")}
          </div></div>
        <div id="qcExtra"></div>
        <div id="qcErr" class="err"></div>
        <button class="btn pri" data-act="save">Save decision</button>
      </div>
    </div>
  </div>`;
}
function renderQCExtra(){
  const v = (document.querySelector('input[name="qc"]:checked')||{}).value;
  const box = $("#qcExtra"); if(!box) return;
  if (!v){ box.innerHTML=""; return; }
  let h = "";
  if (v==="Correction Required" || v==="Wrong Document")
    h += `<label class="f"><span>What needs correcting</span>
      <textarea id="qcComment" placeholder="The submitter sees this."></textarea></label>`;
  if (v==="Correction Required")
    h += `<label class="f" style="margin-top:12px"><span>Correction suspense</span>
      <input type="date" id="qcDue" value="2026-09-19"></label>`;
  if (v==="Not Applicable")
    h += `<label class="f"><span>Authority for waiving this requirement</span>
      <textarea id="qcComment" placeholder="This changes the expected package. Record why."></textarea></label>`;
  box.innerHTML = h;
}

/* ---------- Exceptions ---------- */
function viewExceptions(){
  const q = DB.unmatched.filter(u=>u.Resolution_Status==="Needs Classification");
  return `<div class="card"><header><h2>Unclassified files</h2>
    <span class="sub">Found in a Portfolio FY folder, not matched to a requirement</span></header>
    ${q.length===0?`<div class="empty">Nothing to classify.</div>`:`<div class="pad stack-md">
    ${q.map(u=>{
      const open = classifyOpen[u.Unmatched_ID];
      const conf = c => `<span class="chip c${c==="High"?3:c==="Medium"?2:0}">${c} confidence</span>`;
      const facsFor = iid => FACILITIES.filter(f=>f.Installation_ID===iid);
      return `<div style="border:1px solid var(--line);border-radius:6px;padding:15px">
        <div style="font-weight:600;word-break:break-all">${esc(u.File_Name)}</div>
        <div class="meta" style="margin:3px 0 12px">Portfolio ${esc(u.Portfolio_ID)} · ${esc(u.Fiscal_Year)} ·
          ${u.Uploaded_By?"uploaded by "+esc(u.Uploaded_By):"uploader unknown"} · found ${D.fmt(u.Discovered_DateTime)}</div>

        ${!open?`
          ${u.Sug_Inst?`<div class="section-title">We think this is</div>
          <table style="border:1px solid var(--line);border-radius:6px;margin-bottom:12px">
            <tbody>
              <tr><td class="meta" style="width:130px">Installation</td>
                <td>${esc(inst(u.Sug_Inst).Installation_Name)}</td><td class="num">${conf(u.Sug_Inst_Conf)}</td></tr>
              ${u.Sug_Fac?`<tr><td class="meta">Facility</td><td>${esc(fac(u.Sug_Fac).Facility_Name)}</td>
                <td class="num">${conf(u.Sug_Fac_Conf)}</td></tr>`:""}
              ${u.Sug_Req?`<tr><td class="meta">Document</td><td>${esc(rq(u.Sug_Req).Document_Code)}</td>
                <td class="num">${conf(u.Sug_Req_Conf)}</td></tr>`:""}
              <tr><td class="meta">Period</td><td>${D.period(u.Sug_Period)}</td>
                <td class="num">${conf(u.Sug_Period_Conf)}</td></tr>
            </tbody></table>
          <div class="actions"><button class="btn pri sm" data-act="confirm" data-id="${u.Unmatched_ID}">Confirm</button>
            <button class="btn sm" data-act="change" data-id="${u.Unmatched_ID}">Change classification</button>
            <button class="btn sm" data-act="notdoc" data-id="${u.Unmatched_ID}">Not an EOM document</button></div>`
          :`<div class="note-box" style="margin-bottom:12px">We couldn't determine where this belongs.
             Classify it manually.</div>
            <div class="actions"><button class="btn pri sm" data-act="change" data-id="${u.Unmatched_ID}">Classify</button>
              <button class="btn sm" data-act="notdoc" data-id="${u.Unmatched_ID}">Not an EOM document</button></div>`}
        `:`
          <div class="fields">
            <label class="f"><span>Installation</span>
              <select data-u="${u.Unmatched_ID}" data-k="inst" data-act="cascade"><option value="">Select…</option>
              ${visibleInstallations().map(i=>`<option value="${i.Installation_ID}"
                ${i.Installation_ID===(u.Pick_Inst||u.Sug_Inst)?"selected":""}>${esc(i.Installation_Name)}</option>`).join("")}
              </select></label>
            <label class="f"><span>Facility</span>
              <select data-u="${u.Unmatched_ID}" data-k="fac"><option value="">Installation-level</option>
              ${facsFor(u.Pick_Inst||u.Sug_Inst).map(f=>`<option value="${f.Facility_ID}"
                ${f.Facility_ID===(u.Pick_Fac||u.Sug_Fac)?"selected":""}>${esc(f.Facility_Name)}</option>`).join("")}
              </select></label>
            <label class="f"><span>Document</span>
              <select data-u="${u.Unmatched_ID}" data-k="req"><option value="">Select…</option>
              ${reqsFor(u.Pick_Fac||u.Sug_Fac).map(r=>`<option value="${r.Requirement_ID}"
                ${r.Requirement_ID===u.Sug_Req?"selected":""}>${esc(r.Document_Code)}</option>`).join("")}
              </select></label>
            <label class="f"><span>Period</span>
              <select data-u="${u.Unmatched_ID}" data-k="per">
              ${PERIODS.map(p=>`<option ${p===u.Sug_Period?"selected":""}>${p}</option>`).join("")}</select></label>
          </div>
          <div class="actions" style="margin-top:12px">
            <button class="btn pri sm" data-act="classify" data-id="${u.Unmatched_ID}">Save classification</button>
            <button class="btn sm" data-act="cancelchange" data-id="${u.Unmatched_ID}">Cancel</button></div>`}
      </div>`;}).join("")}
    </div>`}
  </div>`;
}
/* cascading: requirements follow the chosen facility's model, or the
   installation set when no facility is chosen */
function reqsFor(fid){
  if (!fid) return REQUIREMENTS.filter(r=>r.Active_Flag && r.Requirement_Scope!=="Facility");
  const f = fac(fid);
  return REQUIREMENTS.filter(r=>r.Active_Flag && r.Requirement_Scope==="Facility" && matchesReq(f,r));
}

/* ---------- Activity ---------- */
function viewActivity(){
  return `<div class="card"><header><h2>Activity</h2>
    <span class="sub">Business events, stamped with the app version</span></header>
    ${DB.events.length===0?`<div class="empty">No activity yet this session.</div>`:
    `<table class="responsive"><thead><tr><th>Time</th><th>Who</th><th>Event</th>
      <th>Result</th><th>Detail</th></tr></thead><tbody>
      ${DB.events.map(e=>`<tr><td class="meta">${esc(e.Event_DateTime)}</td>
        <td>${esc(e.User_UPN)}</td><td>${esc(e.Event_Type)}</td>
        <td>${esc(e.Result)}</td><td class="meta">${esc(e.Detail)}</td></tr>`).join("")}
    </tbody></table>`}
  </div>`;
}

/* ---------- Admin ---------- */
function viewAdmin(){
  const h = configHealth();
  const ok = t=>`<span class="chip c3">${t}</span>`, warn = t=>`<span class="chip c2">${t}</span>`;
  return `
  <div class="card"><header><h2>System health</h2>
    <span class="sub">Faster than reading flow run history</span></header>
    <div class="pad stack-sm">
      <div>${ok(h.installations+" installations mapped")}</div>
      <div>${ok(h.facilities+" facilities mapped")}</div>
      <div>${h.orphans.length?warn(h.orphans.length+" facilities have no requirement set"):ok("All facilities have a requirement set")}</div>
      <div>${ok(h.generated+" items generated for "+D.period(PERIOD))}</div>
      <div>${h.unmatched?warn(h.unmatched+" unclassified documents"):ok("No unclassified documents")}</div>
      <div>${ok("No duplicate current submissions")}</div>
      ${h.orphans.length?`<div class="warn-box"><b>Configuration warning</b><br>
        ${h.orphans.map(f=>`${esc(inst(f.Installation_ID).Installation_Name)} · ${esc(f.Facility_Name)} —
          operating model ${esc(f.Operating_Model)} has no active requirement set. Its package will
          render empty and read as compliant.`).join("<br>")}</div>`:""}
    </div>
  </div>
  <div class="card"><header><h2>Requirements</h2>
    <span class="sub">Change a requirement here, never in the app or a flow</span></header>
    <table class="responsive"><thead><tr><th>Code</th><th>Model</th><th>Scope</th>
      <th>Due</th><th>Authority status</th></tr></thead><tbody>
      ${REQUIREMENTS.map(r=>`<tr><td><b>${esc(r.Document_Code)}</b>
        <div class="meta">${esc(r.Document_Name)}</div></td>
        <td class="meta">${esc(r.Applicable_Model)}</td><td>${esc(r.Requirement_Scope)}</td>
        <td>${r.Due_Day}th</td>
        <td><span class="chip c4">${esc(r.Authority_Status)}</span>
          <div class="meta">${esc(r.Authority_Reference)}</div></td></tr>`).join("")}
    </tbody></table>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════
   /ui — render + single delegated event handler
   ══════════════════════════════════════════════════════════════ */
const VIEWS = {home:viewHome, package:viewPackage, installations:viewInstallations,
  review:viewReview, exceptions:viewExceptions, activity:viewActivity, admin:viewAdmin};

function render(){
  $("#whoName").textContent = `${ME.Name} — ${ME.Role}`;
  $("#whoScope").textContent = ME.desc;
  $("#whoAv").textContent = ME.Name.split(" ").map(x=>x[0]).join("").slice(0,2);
  $("#perSel").innerHTML = PERIODS.map(p=>`<option value="${p}" ${p===PERIOD?"selected":""}>
    ${D.period(p)}${p===PERIODS[0]?" (open)":""}</option>`).join("");
  renderTabs();
  $("#view").innerHTML = (VIEWS[TAB]||viewHome)();
  if (TAB==="review" && SEL.item) renderQCExtra();
}

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  const id = el.dataset.id;
  switch(el.dataset.act){
    case "open": {
      const it = DB.items.find(i=>i.EOM_Item_ID===id); if(!it) return;
      if (ME.Can_QC && it.Received_Flag){ SEL.item=id; TAB="review"; }
      else if (it.Facility_ID){ SEL.fac=it.Facility_ID; TAB = ME.Scope_Type==="Facility"?"package":"package"; }
      else { SEL.inst=it.Installation_ID; TAB="installations"; }
      render(); break; }
    case "inst": SEL.inst=id; TAB="installations"; render(); break;
    case "fac":  SEL.fac=id;  TAB="package"; render(); break;
    case "tab":
      if (id==="installations-root"){ SEL.inst=null; TAB="installations"; }
      else TAB=id;
      render(); break;
    case "back": SEL.item=null; render(); break;
    case "qcpick": renderQCExtra(); break;
    case "save": saveReview(); break;
    case "pick": setFile(["Monthly Food Report Final.xlsx","August 1119.xlsx",
      "scan_2026_08.pdf","aug financials FINAL v3.xlsx"][Math.floor(Math.random()*4)]); break;
    case "clear": setFile(null); break;
    case "submit": doSubmit(); break;
    case "folder": toast("Would open the Portfolio FY folder in Teams."); break;
    case "confirm": confirmClassification(id); break;
    case "change": classifyOpen[id]=true; render(); break;
    case "cancelchange": classifyOpen[id]=false; render(); break;
    case "classify": manualClassify(id); break;
    case "notdoc": {
      const u=DB.unmatched.find(x=>x.Unmatched_ID===id);
      u.Resolution_Status="Not an EOM document";
      logEvent("ManualClassification","Success",u.File_Name+" marked not an EOM document");
      toast("Removed from the queue."); render(); break; }
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if (el.id==="perSel"){ PERIOD=el.value; SEL.item=null; render(); return; }
  if (el.id==="selReq"){ $("#btnSubmit").disabled = !(pendingFile && el.value); return; }
  if (el.dataset && el.dataset.act==="cascade"){
    const u = DB.unmatched.find(x=>x.Unmatched_ID===el.dataset.u);
    u.Pick_Inst = el.value; u.Pick_Fac = ""; render(); return;
  }
  if (el.dataset && el.dataset.k==="fac"){
    const u = DB.unmatched.find(x=>x.Unmatched_ID===el.dataset.u);
    if (u){ u.Pick_Fac = el.value; render(); }
  }
});
document.addEventListener("dragover", e=>{ if(e.target.closest("#drop")) e.preventDefault(); });
document.addEventListener("drop", e=>{
  const d = e.target.closest("#drop"); if(!d) return;
  e.preventDefault(); setFile((e.dataTransfer.files[0]||{}).name || "dropped-file.xlsx");
});

function setFile(n){
  pendingFile = n;
  const f=$("#fname"), d=$("#drop"), b=$("#btnSubmit");
  if(!f) return;
  f.textContent = n||"";
  d.classList.toggle("armed", !!n);
  if(b) b.disabled = !(n && $("#selReq") && $("#selReq").value);
}

function doSubmit(){
  const itemId = $("#selReq").value, err=$("#upErr");
  const it = DB.items.find(i=>i.EOM_Item_ID===itemId);
  if (!it){ err.textContent="Pick a requirement."; err.classList.add("on"); return; }
  const ob = $("#onBehalf") && $("#onBehalf").value==="yes";
  const v = createSubmission(it, pendingFile, {onBehalf: ob ? (it.Facility_ID||it.Installation_ID):""});
  logEvent("SubmissionCreated","Success",
    `${rq(it.Requirement_ID).Document_Code} · ${pendingFile} · declared at upload`);
  toast("Submission added.");
  pendingFile=null; err.classList.remove("on"); render();
}

function saveReview(){
  const picked = document.querySelector('input[name="qc"]:checked');
  const err = $("#qcErr"); err.classList.remove("on");
  if (!picked){ err.textContent="Choose a decision."; err.classList.add("on"); return; }
  const v = picked.value;
  const comment = ($("#qcComment")||{}).value || "";
  const due = ($("#qcDue")||{}).value || "";
  if (["Correction Required","Wrong Document"].includes(v) && !comment.trim()){
    err.textContent="Add a comment explaining what needs correcting."; err.classList.add("on"); return; }
  if (v==="Not Applicable" && !comment.trim()){
    err.textContent="Record the authority for waiving this requirement."; err.classList.add("on"); return; }
  if (v==="Correction Required" && !due){
    err.textContent="Set a date for the corrected document."; err.classList.add("on"); return; }

  const it = DB.items.find(i=>i.EOM_Item_ID===SEL.item);
  const cur = curSub(it);
  cur.QC_Status=v; cur.QC_By=ME.Name; cur.QC_DateTime=TODAY; cur.QC_Comment=comment;
  it.Correction_Due = v==="Correction Required" ? due : null;
  logEvent(v==="Accepted"?"QCAccepted":v==="Correction Required"?"QCCorrectionRequired":"QCWrongDocument",
    "Success", `${rq(it.Requirement_ID).Document_Code} · ${inst(it.Installation_ID).Installation_Name}`);
  toast("Decision saved.");
  SEL.item=null; render();
}

function confirmClassification(uid){
  const u = DB.unmatched.find(x=>x.Unmatched_ID===uid);
  applyClassification(u, u.Sug_Inst, u.Sug_Fac, u.Sug_Req, u.Sug_Period, "Folder context");
}
function manualClassify(uid){
  const g = k => (document.querySelector(`[data-u="${uid}"][data-k="${k}"]`)||{}).value || "";
  const u = DB.unmatched.find(x=>x.Unmatched_ID===uid);
  applyClassification(u, g("inst"), g("fac"), g("req"), g("per"), "Manual");
}
function applyClassification(u, iid, fid, rid, per, method){
  if (!iid || !rid){ toast("Pick an installation and a document."); return; }
  const it = findItem(per, rid, fid, iid);
  if (!it){
    logEvent("ClassificationUncertain","Warning",`${u.File_Name} — no matching requirement`);
    toast("No expected requirement matches that combination."); return; }
  createSubmission(it, u.File_Name, {by:u.Uploaded_By||"Unknown", when:u.Discovered_DateTime,
    method:"Folder drop", classMethod:method});
  u.Resolution_Status="Classified";
  classifyOpen[u.Unmatched_ID]=false;
  logEvent("ManualClassification","Success",
    `${u.File_Name} → ${rq(rid).Document_Code} at ${inst(iid).Installation_Name}`);
  toast("Classified and added to the review queue.");
  render();
}

/* ══════════════════════════════════════════════════════════════
   boot
   ══════════════════════════════════════════════════════════════ */
$("#roleSel").innerHTML = IDENTITIES.map(r=>`<option value="${r.key}">${r.Name} — ${r.Role}</option>`).join("");
$("#roleSel").addEventListener("change", e=>{
  ME = IDENTITIES.find(r=>r.key===e.target.value);
  SEL={inst:null,fac:null,item:null}; TAB="home"; classifyOpen={};
  logEvent("AppOpened","Success","Identity switched (test harness)");
  render();
});
$("#dateSel").addEventListener("change", e=>{ TODAY=e.target.value; render(); });
$("#resetBtn").addEventListener("click", ()=>{
  SEL={inst:null,fac:null,item:null}; TAB="home"; classifyOpen={}; seed(); render(); toast("Reset.");
});
seed(); render();
</script>
