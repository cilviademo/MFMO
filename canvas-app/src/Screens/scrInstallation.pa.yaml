# =============================================================================
# scrInstallation — installation rollup.
#
# Two things this screen has to get right:
#
#   1. Installation- and Contract-scope rows have a null Facility_ID. They are
#      reached through Installation_ID, never through IsBlank(Facility_ID) —
#      which does not delegate and does not mean what it looks like.
#   2. A facility user must not receive an installation figure derived from
#      their neighbours. When the viewer's scope is narrower than the heading,
#      the figure is labelled as covering their facilities only. It is never
#      silently narrowed and presented as the installation total.
# =============================================================================

Screens:
  scrInstallation:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Concurrent(
            Set(locInstallation, Coalesce(locInstallation, gblCurrentFacility.Installation_ID)),
            If(
                MF_ShouldLog("ScreenView"),
                Patch(MF_App_Event_Log, Defaults(MF_App_Event_Log),
                      MF_TelemetryRow("ScreenView", "Debug", "scrInstallation", locInstallation, ""))
            )
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:

            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  LayoutWrap: =true
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back to my work"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - cmbInstallation:
                      Control: ComboBox
                      Properties:
                        Items: |
                          =If(
                              MF_IsGlobalScope,
                              Filter(MF_Installation, Is_Active = true),
                              Filter(
                                  MF_Installation,
                                  Is_Active = true,
                                  Installation_ID in MF_MyInstallationIDs || Portfolio_ID in MF_MyPortfolioIDs
                              )
                          )
                        DisplayFields: =["Title"]
                        SelectMultiple: =false
                        OnChange: =Set(locInstallation, Self.Selected.Installation_ID)
                        AccessibleLabel: ="Installation"
                        LayoutMinWidth: =240
                        TabIndex: =0
                  - cmbPeriod:
                      Control: ComboBox
                      Properties:
                        Items: =MF_SelectablePeriods
                        DisplayFields: =["Title"]
                        SelectMultiple: =false
                        DefaultSelectedItems: =[MF_CurrentPeriod]
                        OnChange: =Set(locPeriod, Self.Selected)
                        AccessibleLabel: ="Reporting period"
                        LayoutMinWidth: =160
                        TabIndex: =0

            - conContent:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutGap: =12
                  LayoutMinWidth: =320
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:

                  - cardInstallation:
                      Control: Component
                      ComponentName: cmpMetricCard
                      Properties:
                        Label: ="Installation, " & Coalesce(locPeriod.Title, MF_CurrentPeriod.Title)
                        Items: =MF_ItemsForInstallation(locInstallation, Coalesce(locPeriod.Period_ID, MF_CurrentPeriod.Period_ID))
                        # Non-blank when the viewer's scope is narrower than
                        # the heading. Rendered as text, never hidden.
                        ScopeQualifier: =MF_ScopeQualifier(locInstallation)

                  - lblScopeRows:
                      Control: Text
                      Variant: Caption
                      Properties:
                        # Installation- and Contract-scope obligations are the
                        # ones people forget exist. Count them explicitly.
                        Text: |
                          =With(
                              { items: MF_ItemsForInstallation(locInstallation, Coalesce(locPeriod.Period_ID, MF_CurrentPeriod.Period_ID)) },
                              Text(CountRows(Filter(items, Requirement_Scope.Value = "Facility"))) & " facility-scope, " &
                              Text(CountRows(Filter(items, Requirement_Scope.Value = "Installation"))) & " installation-scope, " &
                              Text(CountRows(Filter(items, Requirement_Scope.Value = "Contract"))) & " contract-scope"
                          )
                        Color: =clrTextSecondary
                        AutoHeight: =true
                        TabIndex: =-1

                  - galFacilities:
                      Control: Gallery
                      Variant: verticalGallery
                      Properties:
                        # Facilities the viewer may see, at this installation.
                        # MF_MyFacilities is already scoped.
                        Items: =Filter(MF_MyFacilities, Installation_ID = locInstallation)
                        TemplateSize: =64
                        Visible: =CountRows(Self.AllItems) > 0
                        AccessibleLabel: ="Facilities at this installation"
                        TabIndex: =0
                      Children:
                        - conFacilityRow:
                            Control: GroupContainer
                            Variant: horizontalAutoLayoutContainer
                            Properties:
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                              LayoutWrap: =true
                              PaddingTop: =8
                              PaddingBottom: =8
                              TabIndex: =-1
                            Children:
                              - lblFacilityName:
                                  Control: Text
                                  Variant: Body
                                  Properties:
                                    Text: =ThisItem.Title
                                    FontWeight: =FontWeight.Semibold
                                    FillPortions: =2
                                    LayoutMinWidth: =160
                                    TabIndex: =-1
                              - lblOperatingModel:
                                  Control: Text
                                  Variant: Caption
                                  Properties:
                                    # The operating model lives on the facility.
                                    # One base runs a legacy DFAC and a Food 2.0
                                    # cafe, and their requirement sets differ —
                                    # so it is shown here, on the facility row.
                                    Text: =ThisItem.Operating_Model.Value
                                    Color: =clrTextSecondary
                                    FillPortions: =1
                                    LayoutMinWidth: =120
                                    AccessibleLabel: ="Operating model: " & ThisItem.Operating_Model.Value
                                    TabIndex: =-1
                              - lblFacilityProgress:
                                  Control: Text
                                  Variant: Body
                                  Properties:
                                    Text: |
                                      =With(
                                          { r: MF_FacilityRollup(ThisItem.Facility_ID, Coalesce(locPeriod.Period_ID, MF_CurrentPeriod.Period_ID)) },
                                          If(r.denominator = 0, "Nothing due", Text(r.complete) & " of " & Text(r.denominator))
                                      )
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                                    AccessibleLabel: |
                                      =With(
                                          { r: MF_FacilityRollup(ThisItem.Facility_ID, Coalesce(locPeriod.Period_ID, MF_CurrentPeriod.Period_ID)) },
                                          ThisItem.Title & ": " &
                                          If(r.denominator = 0, "nothing due", Text(r.complete) & " of " & Text(r.denominator) & " accepted")
                                      )
                                    TabIndex: =-1
                              - btnOpenFacility:
                                  Control: Button
                                  Variant: Secondary
                                  Properties:
                                    Text: ="Open"
                                    AccessibleLabel: ="Open the checklist for " & ThisItem.Title
                                    OnSelect: =Set(gblCurrentFacility, ThisItem); Navigate(scrHome, ScreenTransition.None)
                                    TabIndex: =0

                  - lblScopeItemsHeading:
                      Control: Text
                      Variant: Body
                      Properties:
                        Text: ="Installation and contract obligations"
                        FontWeight: =FontWeight.Semibold
                        TabIndex: =-1

                  - galScopeItems:
                      Control: Gallery
                      Variant: verticalGallery
                      Properties:
                        # Reached by scope, not by asking whether Facility_ID
                        # is blank. See Delegation.fx, the IsBlank trap.
                        Items: |
                          =Filter(
                              MF_ItemsForInstallation(locInstallation, Coalesce(locPeriod.Period_ID, MF_CurrentPeriod.Period_ID)),
                              Requirement_Scope.Value in ["Installation", "Contract"]
                          )
                        TemplateSize: =72
                        Visible: =CountRows(Self.AllItems) > 0
                        AccessibleLabel: ="Installation and contract scope obligations"
                        TabIndex: =0
                      Children:
                        - scopeRow:
                            Control: Component
                            ComponentName: cmpEOMItem
                            Properties:
                              Item: =ThisItem
                              ShowFacility: =true
                              OnPrimaryAction: =Set(locSelectedItem, ThisItem); Navigate(scrUpload, ScreenTransition.None)

                  - emptyScopeItems:
                      Control: Component
                      ComponentName: cmpEmptyState
                      Properties:
                        Visible: =CountRows(galScopeItems.AllItems) = 0
                        Title: ="No installation or contract obligations this period"
                        Body: ="Installation-scope and contract-scope requirements generate rows with no facility. If you expected one here, check that the requirement is active and effective for this period."
