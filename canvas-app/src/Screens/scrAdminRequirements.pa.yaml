# =============================================================================
# scrAdminRequirements — the requirement catalogue.
#
# This is where a requirement stops being provisional. All twelve seeded rows
# are UNVERIFIED, which means none of them can drive a Red status. Verifying
# one is a deliberate administrative act with a named authority behind it, and
# it changes how every facility's tile behaves — so it is recorded, attributed
# and telemetered.
#
# There is no colour picker on this screen. There is no colour picker anywhere.
# =============================================================================

Screens:
  scrAdminRequirements:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Concurrent(
            Set(locReq, Blank()),
            Set(locReqError, ""),
            If(
                MF_ShouldLog("ScreenView"),
                Patch(MF_App_Event_Log, Defaults(MF_App_Event_Log),
                      MF_TelemetryRow("ScreenView", "Debug", "scrAdminRequirements", "", ""))
            )
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:
            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back to my work"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - lblTitle:
                      Control: Text
                      Variant: Subtitle
                      Properties:
                        Text: ="Requirements"
                        TabIndex: =-1

            - conBody:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutWrap: =true
                  LayoutGap: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:

                  - conList:
                      Control: GroupContainer
                      Variant: verticalAutoLayoutContainer
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =320
                        LayoutGap: =8
                        TabIndex: =-1
                      Children:
                        - lblProvisionalCount:
                            Control: Text
                            Variant: Body
                            Properties:
                              Text: |
                                =With(
                                    { n: CountRows(Filter(MF_Requirement, Verification_Status.Value = "UNVERIFIED")) },
                                    Text(n) & " of " & Text(CountRows(MF_Requirement)) &
                                    " requirements are provisional. A provisional requirement past its suspense date shows Gray, not Red, and the action sits with the programme."
                                )
                              Color: =clrText
                              AutoHeight: =true
                              TabIndex: =-1

                        - galRequirements:
                            Control: Gallery
                            Variant: verticalGallery
                            Properties:
                              Items: =SortByColumns(MF_Requirement, "Requirement_ID", SortOrder.Ascending)
                              TemplateSize: =80
                              AccessibleLabel: ="Requirement catalogue"
                              TabIndex: =0
                            Children:
                              - conReqRow:
                                  Control: GroupContainer
                                  Variant: verticalAutoLayoutContainer
                                  Properties:
                                    LayoutGap: =2
                                    PaddingTop: =8
                                    PaddingBottom: =8
                                    TabIndex: =-1
                                  Children:
                                    - lblReqName:
                                        Control: Text
                                        Variant: Body
                                        Properties:
                                          Text: =ThisItem.Requirement_ID & " - " & ThisItem.Title
                                          FontWeight: =FontWeight.Semibold
                                          AutoHeight: =true
                                          TabIndex: =-1
                                    - lblReqMeta:
                                        Control: Text
                                        Variant: Caption
                                        Properties:
                                          Text: |
                                            =ThisItem.Requirement_Scope.Value & " scope - " & ThisItem.Frequency.Value &
                                             " - " & ThisItem.Verification_Status.Value &
                                             If(ThisItem.Is_Active, "", " - INACTIVE")
                                          Color: =clrTextSecondary
                                          AutoHeight: =true
                                          TabIndex: =-1
                                    - btnEditReq:
                                        Control: Button
                                        Variant: Secondary
                                        Properties:
                                          Text: ="Open"
                                          AccessibleLabel: ="Open " & ThisItem.Requirement_ID & " " & ThisItem.Title
                                          OnSelect: =Set(locReq, ThisItem); SetFocus(lblReqDetailHeading)
                                          TabIndex: =0

                        - emptyRequirements:
                            Control: Component
                            ComponentName: cmpEmptyState
                            Properties:
                              # The catalogue is seeded, so empty here means the
                              # list did not load - which looks identical to
                              # "no requirements exist" without this.
                              Visible: =CountRows(galRequirements.AllItems) = 0
                              Title: ="The requirement catalogue is empty"
                              Body: ="Twelve requirements are seeded at provisioning. An empty catalogue means the list did not load or was never seeded. Do not add requirements here to work around it - contact support."

                  - conDetail:
                      Control: GroupContainer
                      Variant: verticalAutoLayoutContainer
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =320
                        LayoutGap: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        PaddingBottom: =16
                        Fill: =clrSurface
                        BorderThickness: =1
                        BorderColor: =clrBorder
                        Visible: =!IsBlank(locReq.Requirement_ID)
                        TabIndex: =-1
                      Children:
                        - lblReqDetailHeading:
                            Control: Text
                            Variant: Subtitle
                            Properties:
                              Text: =locReq.Title
                              AutoHeight: =true
                              TabIndex: =0
                        - lblAuthority:
                            Control: Text
                            Variant: Caption
                            Properties:
                              Text: ="Current authority reference: " & Coalesce(locReq.Authority_Reference, "none recorded")
                              Color: =clrTextSecondary
                              AutoHeight: =true
                              TabIndex: =-1
                        - txtAuthority:
                            Control: TextInput
                            Variant: MultiLine
                            Properties:
                              Default: =locReq.Authority_Reference
                              OnChange: =Set(locAuthority, Self.Value)
                              HintText: ="Regulation, contract clause or policy memo"
                              AccessibleLabel: ="Authority reference. Required to verify this requirement."
                              DisplayMode: =MF_WriteMode
                              TabIndex: =0
                        - lblVerifyRule:
                            Control: Text
                            Variant: Caption
                            Properties:
                              Text: ="Verifying this requirement lets a missed suspense turn a facility Red. Do not verify it without a citation you would defend at an inspection."
                              Color: =clrTextSecondary
                              AutoHeight: =true
                              TabIndex: =-1
                        - lblReqError:
                            Control: Text
                            Variant: Body
                            Properties:
                              Text: =locReqError
                              Color: =clrStatusRed
                              Visible: =!IsBlank(locReqError)
                              AutoHeight: =true
                              Live: =Live.Assertive
                              TabIndex: =-1
                        - btnVerify:
                            Control: Button
                            Variant: Primary
                            Properties:
                              Text: ="Mark verified"
                              AccessibleLabel: ="Mark " & locReq.Title & " as verified"
                              DisplayMode: |
                                =If(
                                    MF_ReadOnlyMode
                                        || !(gblRole in ["Admin", "PortfolioManager"])
                                        || IsBlank(Trim(Coalesce(locAuthority, locReq.Authority_Reference))),
                                    DisplayMode.Disabled,
                                    DisplayMode.Edit
                                )
                              TabIndex: =0
                              OnSelect: |
                                =If(
                                    IsBlank(Trim(Coalesce(locAuthority, locReq.Authority_Reference))),
                                    Set(locReqError, "Record the authority reference before verifying. A verified requirement with no citation is worse than a provisional one."),
                                    Patch(
                                        MF_Requirement,
                                        locReq,
                                        {
                                            Verification_Status: { Value: "VERIFIED" },
                                            Verification_Date: Today(),
                                            Authority_Reference: Coalesce(locAuthority, locReq.Authority_Reference)
                                        }
                                    );
                                    Patch(MF_App_Event_Log, Defaults(MF_App_Event_Log),
                                          MF_TelemetryRow("AdminAction", "Warning", "scrAdminRequirements", locReq.Requirement_ID,
                                              JSON({ action: "VERIFY_REQUIREMENT", requirement: locReq.Requirement_ID })));
                                    Notify(
                                        locReq.Title & " is now verified. Items past suspense against it will show Red from the next status run.",
                                        NotificationType.Success
                                    );
                                    Set(locReq, Blank())
                                )
