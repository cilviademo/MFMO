# =============================================================================
# scrUpload — the front door.
#
# THE ATTACHMENTS CONTROL IS NOT USED. It binds to a Form, targets lists and
# Dataverse rather than document libraries, and behaves badly on Teams and
# mobile. That is a reason not to use the control. It is NOT a reason to stop
# people uploading through the app — reverting to folder-drop-only reintroduces
# the classification risk the declaration removes.
#
# The app collects the file and the declared metadata and calls EOM02_Submission.
# The flow writes the library and the lists.
#
# For a DFAC manager with one facility, MF_ShowDropdowns is false and the screen
# is a title, a period label and a drop target. Everything else is the exception
# path.
#
# Installation, facility, requirement and period are DECLARED here, so nothing
# downstream has to classify the file. Filenames are never validated;
# Accepted_File_Types is advisory.
# =============================================================================

Screens:
  scrUpload:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Concurrent(
            Set(locUploadError, ""),
            Set(locUploadBusy, false),
            Set(locUploadResult, Blank()),
            // Arriving from a gallery row pre-declares everything. Arriving
            // from the nav declares nothing and the user picks.
            Set(locItem, locSelectedItem),
            Set(locOnBehalf, false)
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:

            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back to home"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - lblTitle:
                      Control: Text
                      Variant: Subtitle
                      Properties:
                        Text: ="Submit a document"
                        Color: =clrText
                        TabIndex: =-1
                  - lblPeriod:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: ="Reporting period " & locPeriod
                        Color: =clrTextSecondary
                        TabIndex: =-1

            - conContent:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutGap: =16
                  LayoutMinWidth: =320
                  LayoutMaxWidth: =720
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:

                  # --- Declaration. Tier 0. ----------------------------------
                  - cmbInstallation:
                      Control: ComboBox
                      Properties:
                        Items: =MF_InstallationChoices
                        DisplayFields: =["Installation_Name"]
                        SelectMultiple: =false
                        # Hidden when the user has exactly one, which is most
                        # of them.
                        Visible: =MF_ShowDropdowns && CountRows(MF_InstallationChoices) > 1
                        DefaultSelectedItems: =Filter(MF_InstallationChoices, Installation_ID = locSelectedInstallation)
                        OnChange: =Set(locSelectedInstallation, Self.Selected.Installation_ID); Set(locSelectedFacility, Blank())
                        AccessibleLabel: ="Installation. Required."
                        TabIndex: =0

                  - cmbFacility:
                      Control: ComboBox
                      Properties:
                        Items: =MF_FacilityChoices(locSelectedInstallation)
                        DisplayFields: =["Facility_Name"]
                        SelectMultiple: =false
                        Visible: =MF_ShowDropdowns && CountRows(MF_FacilityChoices(locSelectedInstallation)) > 1
                        DefaultSelectedItems: =Filter(MF_MyFacilities, Facility_ID = locSelectedFacility)
                        OnChange: =Set(locSelectedFacility, Self.Selected.Facility_ID)
                        AccessibleLabel: ="Facility. Required."
                        TabIndex: =0

                  - cmbRequirement:
                      Control: ComboBox
                      Properties:
                        # Facility-scope requirements for THIS facility's model
                        # and type. Installation- and contract-scope belong on
                        # the installation screen: putting them here is how a
                        # DFAC manager ends up filing the base's SIK bill.
                        Items: |
                          =With(
                              { f: LookUp('MF Facility', Facility_ID = locSelectedFacility) },
                              MF_RequirementChoices(f.Operating_Model, f.Facility_Type)
                          )
                        DisplayFields: =["Document_Name"]
                        SearchFields: =["Document_Name", "Document_Code"]
                        SelectMultiple: =false
                        OnChange: =Set(locRequirementId, Self.Selected.Requirement_ID)
                        AccessibleLabel: ="Document. Required."
                        TabIndex: =0

                  - lblProvisionalNote:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: =MF_RequirementAuthorityNote(locRequirementId)
                        Color: =clrTextSecondary
                        Visible: =MF_RequirementIsProvisional(locRequirementId)
                        AutoHeight: =true
                        TabIndex: =-1

                  - tglOnBehalf:
                      Control: Toggle
                      Properties:
                        # Exception path for emailed and recovered documents.
                        # Without it, an emailed document uploaded by an AFSVC
                        # MFM misattributes to AFSVC and the missing counts go
                        # wrong silently.
                        Visible: =gblCanOnBehalf && MF_IsFeatureOn("EOM_ON_BEHALF")
                        Default: =false
                        OnChange: =Set(locOnBehalf, Self.Value)
                        AccessibleLabel: ="Submitting on behalf of another location"
                        TabIndex: =0

                  # --- The file ---------------------------------------------
                  - lblFilenameNote:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: |
                          ="The filename does not matter. You have declared the facility, document and period above, so the file is classified by your declaration and never by its name."
                        Color: =clrTextSecondary
                        AutoHeight: =true
                        TabIndex: =-1

                  - addFile:
                      # AddMedia with a file picker — NOT the Attachments
                      # control. The bytes go to EOM02_Submission; the flow
                      # writes the library.
                      Control: AddMedia
                      Properties:
                        Text: ="Drop file here or browse"
                        AccessibleLabel: ="Choose a file to submit"
                        DisplayMode: =MF_WriteMode
                        OnChange: =Set(locUploadError, "")
                        TabIndex: =0

                  - lblChosenFile:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: =If(IsBlank(addFile.FileName), "No file chosen", "Chosen: " & addFile.FileName)
                        Color: =clrTextSecondary
                        Live: =Live.Polite
                        TabIndex: =-1

                  # --- Errors: announced, in text, with a correction ---------
                  - lblUploadError:
                      Control: Text
                      Variant: Body
                      Properties:
                        Text: =locUploadError
                        Color: =clrStatusRed
                        Visible: =!IsBlank(locUploadError)
                        AutoHeight: =true
                        Live: =Live.Assertive
                        AccessibleLabel: ="Error. " & locUploadError
                        TabIndex: =-1

                  - btnSubmit:
                      Control: Button
                      Variant: Primary
                      Properties:
                        Text: =If(locUploadBusy, "Submitting...", "Submit")
                        AccessibleLabel: |
                          ="Submit " & Coalesce(addFile.FileName, "the chosen file") &
                           " as " & Coalesce(cmbRequirement.Selected.Document_Name, "the chosen document") &
                           " for " & Coalesce(cmbFacility.Selected.Facility_Name, "your facility") &
                           ", " & locPeriod
                        DisplayMode: |
                          =If(
                              !gblCanWrite || locUploadBusy
                                  || IsBlank(addFile.Media) || IsBlank(locRequirementId),
                              DisplayMode.Disabled,
                              DisplayMode.Edit
                          )
                        TabIndex: =0
                        OnSelect: |
                          =Set(locUploadError, "");
                           Set(locUploadBusy, true);
                           // Resolve the expected item from the declaration.
                           // NEVER invent a requirement: no expected row means
                           // no obligation the system knows about.
                           Set(
                               locItem,
                               LookUp(
                                   'MF EOM Item',
                                   Reporting_Period = locPeriod,
                                   Facility_ID = locSelectedFacility,
                                   Requirement_ID = locRequirementId
                               )
                           );
                           If(
                               !gblCanWrite,
                                   Set(locUploadError, "The app is read-only while we finish maintenance. You can view status but not submit."),
                               IsBlank(locItem.EOM_Item_ID),
                                   Set(locUploadError, "We found the file but there's no expected requirement matching that facility, document and period. Send it to Needs Classification and someone will confirm whether the requirement should exist."),
                               // Client-side size check. The flow repeats it.
                               Set(
                                   locUploadResult,
                                   EOM02_Submission.Run(
                                       {
                                           eomItemId:      locItem.EOM_Item_ID,
                                           eomItemKey:     locItem.EOM_Item_Key,
                                           fileName:       addFile.FileName,
                                           fileContent:    addFile.Media,
                                           uploadedBy:     gblCurrentUser.Email,
                                           onBehalfOf:     If(locOnBehalf, locSelectedFacility, Blank()),
                                           intakeMethod:   "App upload",
                                           classification: "Declared at upload",
                                           appVersion:     gblAppVersion
                                       }
                                   )
                               )
                           );
                           Set(locUploadBusy, false);
                           If(
                               locUploadResult.ok,
                                   Notify(
                                       "Submitted. Version " & locUploadResult.versionNo &
                                       ". Previous versions are kept.",
                                       NotificationType.Success
                                   );
                                   Reset(addFile);
                                   Back(ScreenTransition.None),
                               !IsBlank(locUploadResult) && !locUploadResult.ok,
                                   Set(locUploadError, locUploadResult.message)
                           )

                  - lblVersionNote:
                      Control: Text
                      Variant: Caption
                      Properties:
                        # Nothing is overwritten. Say so before they worry.
                        Text: |
                          =With(
                              { current: LookUp('MF EOM Submission',
                                                EOM_Item_ID = locItem.EOM_Item_ID,
                                                Is_Current = true) },
                              If(
                                  IsBlank(current.Submission_ID),
                                  "This will be version 1.",
                                  "This will become version " & (current.Version_No + 1) &
                                  ". Version " & current.Version_No &
                                  " is kept and stays viewable in Activity."
                              )
                          )
                        Color: =clrTextSecondary
                        Visible: =!IsBlank(locItem.EOM_Item_ID)
                        AutoHeight: =true
                        TabIndex: =-1

                  - lblFolderRoute:
                      Control: Text
                      Variant: Caption
                      Properties:
                        # Folder drops keep working. Say it, so nobody thinks
                        # the app is the only route.
                        Text: ="You can also drop files straight into the Portfolio FY folder. They are discovered automatically and routed for classification."
                        Color: =clrTextSecondary
                        AutoHeight: =true
                        TabIndex: =-1
