# =============================================================================
# scrHistory — version history for one item.
#
# Never overwrite a file, never duplicate the checklist row. Every version is
# preserved and viewable, including the ones that were returned. The audit
# question this screen answers is "what did they send, when, and what did the
# reviewer say" — for every attempt, not just the accepted one.
# =============================================================================

Screens:
  scrHistory:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =If(
            MF_ShouldLog("ScreenView"),
            Patch(MF_App_Event_Log, Defaults(MF_App_Event_Log),
                  MF_TelemetryRow("ScreenView", "Debug", "scrHistory", locSelectedItem.EOM_Item_ID, ""))
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:
            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - lblTitle:
                      Control: Text
                      Variant: Subtitle
                      Properties:
                        Text: =Coalesce(locSelectedItem.Requirement_Name, "History")
                        TabIndex: =-1

            - conContent:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutGap: =12
                  LayoutMinWidth: =320
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:
                  - lblItemKey:
                      Control: Text
                      Variant: Caption
                      Properties:
                        # The compound key. Shown because it is what a support
                        # conversation and a Power BI row both refer to.
                        Text: =locSelectedItem.Title
                        Color: =clrTextSecondary
                        AccessibleLabel: ="Item key " & locSelectedItem.Title
                        TabIndex: =-1

                  - badgeCurrent:
                      Control: Component
                      ComponentName: cmpStatusBadge
                      Properties:
                        StatusCode: =locSelectedItem.Status_Code.Value
                        SuspenseDate: =locSelectedItem.Suspense_Date

                  - galVersions:
                      Control: Gallery
                      Variant: verticalGallery
                      Properties:
                        Items: =MF_VersionsForItem(locSelectedItem.EOM_Item_ID)
                        TemplateSize: =96
                        Visible: =CountRows(Self.AllItems) > 0
                        AccessibleLabel: ="Submission versions, newest first"
                        TabIndex: =0
                      Children:
                        - conVersion:
                            Control: GroupContainer
                            Variant: verticalAutoLayoutContainer
                            Properties:
                              LayoutGap: =2
                              PaddingTop: =8
                              PaddingBottom: =8
                              BorderThickness: =1
                              BorderColor: =clrBorder
                              PaddingLeft: =12
                              PaddingRight: =12
                              Fill: =If(ThisItem.Is_Current_Version, clrSurface, clrSurfaceAlt)
                              TabIndex: =-1
                            Children:
                              - lblVersionHeading:
                                  Control: Text
                                  Variant: Body
                                  Properties:
                                    Text: |
                                      ="Version " & ThisItem.Version_Number &
                                       If(ThisItem.Is_Current_Version, " (current)", " (superseded)")
                                    FontWeight: =FontWeight.Semibold
                                    TabIndex: =-1
                              - lblVersionMeta:
                                  Control: Text
                                  Variant: Caption
                                  Properties:
                                    Text: |
                                      =Text(ThisItem.Submitted_On, "d mmm yyyy hh:nn") & " - " & ThisItem.Submitted_By_UPN &
                                       " - " & ThisItem.Submission_Channel.Value &
                                       " - classified " & ThisItem.Classification_Method.Value
                                    Color: =clrTextSecondary
                                    AutoHeight: =true
                                    TabIndex: =-1
                              - lblVersionQc:
                                  Control: Text
                                  Variant: Caption
                                  Properties:
                                    Text: |
                                      =If(
                                          IsBlank(ThisItem.QC_Status.Value),
                                          "Not yet reviewed",
                                          ThisItem.QC_Status.Value & " by " & Coalesce(ThisItem.QC_Reviewer_UPN, "unknown") &
                                          If(IsBlank(ThisItem.QC_Comment), "", " - " & ThisItem.QC_Comment) &
                                          If(IsBlank(ThisItem.New_Suspense_Date), "", " - new suspense " & Text(ThisItem.New_Suspense_Date, "d mmm yyyy"))
                                      )
                                    Color: =clrTextSecondary
                                    AutoHeight: =true
                                    TabIndex: =-1
                              - btnOpenVersion:
                                  Control: Button
                                  Variant: Subtle
                                  Properties:
                                    Text: ="Open file"
                                    AccessibleLabel: ="Open version " & ThisItem.Version_Number & " of " & locSelectedItem.Requirement_Name
                                    OnSelect: =Launch(ThisItem.SharePoint_File_Url, {}, LaunchTarget.New)
                                    TabIndex: =0

                  - emptyVersions:
                      Control: Component
                      ComponentName: cmpEmptyState
                      Properties:
                        Visible: =CountRows(galVersions.AllItems) = 0
                        Title: ="Nothing submitted yet"
                        Body: ="No file has been submitted against this obligation. The checklist row exists because the requirement expects one."
                        ActionLabel: ="Submit a document"
                        OnAction: =Set(locItem, locSelectedItem); Navigate(scrUpload, ScreenTransition.None)
