# =============================================================================
# scrAccessRequest — the exception path to the GAL-derived model.
#
# Nobody is provisioned for their own base: CAC identifies the user and the GAL
# gives their installation. This screen exists for the case identity cannot
# answer — someone who PCS'd but still owes their losing base a package.
#
# Modelled on how Teams handles a request to join. REQUESTED ACCESS EXPIRES,
# sixty days by default: a departing member needs a handover window, not
# permanent rights to a base they left.
# =============================================================================

Screens:
  scrAccessRequest:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Concurrent(
            Set(locReqInstallation, Blank()),
            Set(locReqJustification, ""),
            Set(locReqUntil, DateAdd(Today(), MF_ConfigNumber("AccessRequestDefaultDays", 60), Days)),
            Set(locReqError, "")
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:
            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - lblTitle:
                      Control: Text
                      Variant: Subtitle
                      Properties:
                        Text: ="Request access to another installation"
                        AutoHeight: =true
                        TabIndex: =-1

            - conContent:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutGap: =12
                  LayoutMinWidth: =320
                  LayoutMaxWidth: =680
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:
                  - lblExplain:
                      Control: Text
                      Variant: Body
                      Properties:
                        Text: |
                          ="You already have access to " & Coalesce(gblMyInstallation, "your installation") &
                           " because of where the Global Address List says you are posted. Request another installation only if you still owe it a package - after a PCS, for example."
                        Color: =clrText
                        AutoHeight: =true
                        TabIndex: =-1

                  - cmbInstallation:
                      Control: ComboBox
                      Properties:
                        Items: =SortByColumns(Filter('MF Installation', Active_Flag = true), "Installation_Name", SortOrder.Ascending)
                        DisplayFields: =["Installation_Name"]
                        SearchFields: =["Installation_Name"]
                        SelectMultiple: =false
                        OnChange: =Set(locReqInstallation, Self.Selected.Installation_ID)
                        AccessibleLabel: ="Installation you need access to. Required."
                        TabIndex: =0

                  - txtJustification:
                      Control: TextInput
                      Variant: MultiLine
                      Properties:
                        Default: =locReqJustification
                        OnChange: =Set(locReqJustification, Self.Value)
                        HintText: ="Why you need it, and what you still owe them"
                        AccessibleLabel: ="Justification. Required - a request with no reason cannot be judged."
                        DisplayMode: =MF_WriteMode
                        TabIndex: =0

                  - dteUntil:
                      Control: DatePicker
                      Properties:
                        DefaultDate: =locReqUntil
                        OnChange: =Set(locReqUntil, Self.SelectedDate)
                        AccessibleLabel: ="Access needed until. Defaults to 60 days."
                        DisplayMode: =MF_WriteMode
                        TabIndex: =0

                  - lblExpiryNote:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: ="Requested access expires. You can ask again if the handover runs longer than expected."
                        Color: =clrTextSecondary
                        AutoHeight: =true
                        TabIndex: =-1

                  - lblReqError:
                      Control: Text
                      Variant: Body
                      Properties:
                        Text: =locReqError
                        Color: =clrStatusRed
                        Visible: =!IsBlank(locReqError)
                        AutoHeight: =true
                        Live: =Live.Assertive
                        AccessibleLabel: ="Error. " & locReqError
                        TabIndex: =-1

                  - btnSubmitRequest:
                      Control: Button
                      Variant: Primary
                      Properties:
                        Text: ="Send request"
                        AccessibleLabel: ="Send the access request for review"
                        DisplayMode: |
                          =If(
                              !gblCanWrite || IsBlank(locReqInstallation)
                                  || IsBlank(Trim(locReqJustification)),
                              DisplayMode.Disabled, DisplayMode.Edit)
                        TabIndex: =0
                        OnSelect: |
                          =If(
                              IsBlank(Trim(locReqJustification)),
                                  Set(locReqError, "Add a justification. A request with no reason cannot be judged."),
                              Patch('MF Access Request', Defaults('MF Access Request'),
                                  { Request_ID: "AR-" & Text(Now(), "yyyymmddhhmmss"),
                                    // Resolved identity, never a typed name.
                                    Requester_UPN: gblCurrentUser.Email,
                                    Requester_Name: gblCurrentUser.FullName,
                                    Home_Installation: gblMyInstallation,
                                    Requested_Installation_ID: locReqInstallation,
                                    Justification: locReqJustification,
                                    Requested_Until: locReqUntil,
                                    Status: "Pending" });
                              Patch('MF App Event Log', Defaults('MF App Event Log'),
                                  MF_EventRow("PermissionDenied", "Warning", locReqInstallation,
                                              "ACCESS_REQUESTED",
                                              "Access requested until " & Text(locReqUntil, "yyyy-mm-dd")));
                              Notify("Request sent. Someone who can grant access will decide it.",
                                     NotificationType.Success);
                              Back(ScreenTransition.None)
                          )

                  - lblMyRequestsHeading:
                      Control: Text
                      Variant: Body
                      Properties:
                        Text: ="Your requests"
                        FontWeight: =FontWeight.Semibold
                        TabIndex: =-1

                  - galMyRequests:
                      Control: Gallery
                      Variant: verticalGallery
                      Properties:
                        # Delegable on the indexed Requester_UPN.
                        Items: |
                          =SortByColumns(
                              Filter('MF Access Request', Requester_UPN = gblCurrentUser.Email),
                              "Requested_Until", SortOrder.Descending)
                        TemplateSize: =56
                        Visible: =CountRows(Self.AllItems) > 0
                        AccessibleLabel: ="Your access requests"
                        TabIndex: =0
                      Children:
                        - lblRequestRow:
                            Control: Text
                            Variant: Caption
                            Properties:
                              Text: |
                                =ThisItem.Requested_Installation_ID & "  " & ThisItem.Status &
                                 If(IsBlank(ThisItem.Requested_Until), "",
                                    "  until " & Text(ThisItem.Requested_Until, "d mmm yyyy")) &
                                 If(IsBlank(ThisItem.Decision_Comment), "", "  " & ThisItem.Decision_Comment)
                              AutoHeight: =true
                              TabIndex: =-1

                  - emptyRequests:
                      Control: Component
                      ComponentName: cmpEmptyState
                      Properties:
                        Visible: =CountRows(galMyRequests.AllItems) = 0
                        Title: ="No requests"
                        Body: ="You have not requested access to another installation. Your own base needs no request."
