# =============================================================================
# cmpEOMItem — one checklist row.
#
#   Requirement · Scope · Due · Status · Action
#
# This is the row shape R2-R4 reuse without new UX. FMAT, Training, Equipment
# and the Five-Year Plan are the same five columns with a different requirement
# catalogue behind them. Getting this component right is most of what R1 is for.
#
# On narrow widths the container wraps into a record card rather than hiding
# columns — a truncated table on a phone loses the status, which is the one
# thing the row exists to show.
# =============================================================================

ComponentDefinitions:
  cmpEOMItem:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:

      Item:
        PropertyKind: Input
        Description: One MF EOM Item record. The component reads the stored status; it never recomputes one.
        DataType: Record
        Default: =Blank()

      ShowScopeTarget:
        PropertyKind: Input
        Description: False on a facility screen where every row is the same facility; true on installation and portfolio views.
        DataType: Boolean
        Default: =true

      OnPrimaryAction:
        PropertyKind: Event
        Description: Raised by the row's primary button. The caller decides what it means; the component does not navigate.
        ReturnType: None

    Properties:
      Height: =Self.conItem.Height
      Width: =Parent.Width

    Children:
      - conItem:
          Control: GroupContainer
          Variant: horizontalAutoLayoutContainer
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            LayoutWrap: =true
            PaddingTop: =10
            PaddingBottom: =10
            PaddingLeft: =12
            PaddingRight: =12
            Fill: =clrSurface
            BorderThickness: =1
            BorderColor: =clrBorder
            TabIndex: =-1
          Children:

            # --- Requirement -------------------------------------------------
            - conRequirement:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  FillPortions: =3
                  LayoutMinWidth: =180
                  LayoutGap: =2
                  TabIndex: =-1
                Children:
                  - lblDocumentCode:
                      Control: Text
                      Variant: Body
                      Properties:
                        Text: =LookUp('MF EOM Requirement', Requirement_ID = cmpEOMItem.Item.Requirement_ID).Document_Code
                        Color: =clrText
                        FontWeight: =FontWeight.Semibold
                        AutoHeight: =true
                        TabIndex: =-1
                  - lblScopeTarget:
                      Control: Text
                      Variant: Caption
                      Properties:
                        # Installation- and Contract-scope rows have a null
                        # Facility_ID by design. Say what the row IS rather
                        # than leaving a blank the reader has to interpret —
                        # nobody should wonder why the SIK bill isn't on
                        # every DFAC.
                        Text: |
                          =Switch(
                              cmpEOMItem.Item.Requirement_Scope,
                              "Facility",
                                  LookUp('MF Facility', Facility_ID = cmpEOMItem.Item.Facility_ID).Facility_Name,
                              "Contract",
                                  "Contract " & cmpEOMItem.Item.Contract_ID,
                                  "Installation-level - " &
                                  LookUp('MF Installation', Installation_ID = cmpEOMItem.Item.Installation_ID).Installation_Name
                          )
                        Color: =clrTextSecondary
                        Visible: =cmpEOMItem.ShowScopeTarget
                        AutoHeight: =true
                        TabIndex: =-1
                  - lblProvisional:
                      Control: Text
                      Variant: Caption
                      Properties:
                        # An unverified requirement renders with its reason,
                        # not merely dimmed. It cannot drive an adverse status
                        # and people should know why the box is there.
                        Text: =MF_RequirementAuthorityNote(cmpEOMItem.Item.Requirement_ID)
                        Color: =clrTextSecondary
                        Visible: =MF_RequirementIsProvisional(cmpEOMItem.Item.Requirement_ID)
                        AutoHeight: =true
                        TabIndex: =-1

            # --- Scope -------------------------------------------------------
            - lblScope:
                Control: Text
                Variant: Caption
                Properties:
                  Text: =cmpEOMItem.Item.Requirement_Scope
                  Color: =clrTextSecondary
                  FillPortions: =1
                  LayoutMinWidth: =90
                  AccessibleLabel: ="Scope: " & cmpEOMItem.Item.Requirement_Scope
                  TabIndex: =-1

            # --- Due ---------------------------------------------------------
            - conDue:
                Control: GroupContainer
                Variant: verticalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutMinWidth: =110
                  LayoutGap: =2
                  TabIndex: =-1
                Children:
                  - lblDue:
                      Control: Text
                      Variant: Body
                      Properties:
                        # "Due 5 Sep (Mon 8 Sep)" where the suspense moved off a
                        # weekend or holiday. Burying that adjustment in a formula
                        # produces a monthly argument.
                        Text: =MF_DueDatePhrase(cmpEOMItem.Item.Nominal_Due_Date, cmpEOMItem.Item.Effective_Due_Date)
                        Color: =clrText
                        # Not "5 days late" in red — the chip already says
                        # overdue, and repeating it in colour alone would fail
                        # gate A4.
                        AccessibleLabel: |
                          ="Due " & Text(cmpEOMItem.Item.Nominal_Due_Date, "d mmmm yyyy") &
                           If(cmpEOMItem.Item.Due_Date_Adjusted,
                              ", moved to " & Text(cmpEOMItem.Item.Effective_Due_Date, "dddd d mmmm") &
                              " because the suspense fell on a non-duty day", "")
                        TabIndex: =-1
                  - lblCorrectionDue:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: ="Correction due " & Text(cmpEOMItem.Item.Correction_Due, "d mmm")
                        Color: =clrTextSecondary
                        Visible: =!IsBlank(cmpEOMItem.Item.Correction_Due)
                        TabIndex: =-1

            # --- Status ------------------------------------------------------
            - badgeStatus:
                Control: Component
                ComponentName: cmpStatusBadge
                Properties:
                  FinalStatus: =cmpEOMItem.Item.Final_Status
                  NominalDueDate: =cmpEOMItem.Item.Nominal_Due_Date
                  EffectiveDueDate: =cmpEOMItem.Item.Effective_Due_Date
                  LayoutMinWidth: =170
                  FillPortions: =2

            # --- Action ------------------------------------------------------
            - btnPrimary:
                Control: Button
                Variant: Primary
                Properties:
                  # The action follows the owner, and the owner comes from the
                  # engine. Nothing here decides a status.
                  Text: |
                    =Switch(
                        cmpEOMItem.Item.Final_Status,
                        "ACCEPTED",            "View",
                        "RECEIVED_PENDING_QC", If(gblCanQC, "Review", "View"),
                        "RETURNED",            "Resubmit",
                        "NOT_SATISFIED",       "Resubmit",
                        "LATE",                "Submit",
                        "PENDING_VALIDATION",  If(gblCanEditReqs, "Verify requirement", "Submit"),
                        "NOT_APPLICABLE",      "View",
                        "Submit"
                    )
                  # A screen reader user tabbing a gallery must not hear the
                  # same word twelve times. Gate A6.
                  AccessibleLabel: |
                    =Self.Text & " " &
                    LookUp('MF EOM Requirement', Requirement_ID = cmpEOMItem.Item.Requirement_ID).Document_Name &
                    ", " & Switch(
                        cmpEOMItem.Item.Requirement_Scope,
                        "Facility", LookUp('MF Facility', Facility_ID = cmpEOMItem.Item.Facility_ID).Facility_Name,
                        "Contract", "contract " & cmpEOMItem.Item.Contract_ID,
                        LookUp('MF Installation', Installation_ID = cmpEOMItem.Item.Installation_ID).Installation_Name
                    ) &
                    ", " & cmpEOMItem.Item.Reporting_Period &
                    ". Current status: " & MF_Status(cmpEOMItem.Item.Final_Status).label
                  # Read-only mode disables every write affordance. The flow
                  # enforces the same key; this is the courtesy half.
                  DisplayMode: |
                    =If(
                        !gblCanWrite && Self.Text <> "View",
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  OnSelect: =cmpEOMItem.OnPrimaryAction()
                  LayoutMinWidth: =140
                  FillPortions: =1
                  TabIndex: =0
