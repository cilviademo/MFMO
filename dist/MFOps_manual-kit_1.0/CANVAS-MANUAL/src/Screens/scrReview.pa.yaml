# =============================================================================
# scrReview — QC.
#
# Document-centric. Left: the document and its history. Right: the decision.
#
# The app writes QC state directly — there is no separate QC flow. EOM-04 only
# notices the resulting state change.
#
# QC decisions are INPUTS to the status engine, not statuses. A reviewer picks
# a verdict; the engine decides what the item then looks like. In particular a
# Wrong Document verdict does NOT make the item permanently Red: the
# requirement is still unmet, and whether that is urgent depends on the
# suspense date.
#
# Progressive disclosure: the comment and suspense fields appear only for the
# verdicts that need them.
# =============================================================================

Screens:
  scrReview:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Concurrent(
            Set(locQCVerdict, Blank()),
            Set(locQCComment, ""),
            Set(locCorrectionDue, Blank()),
            Set(locQCError, ""),
            Set(locSubmission,
                LookUp('MF EOM Submission',
                       EOM_Item_ID = locSelectedItem.EOM_Item_ID,
                       Is_Current = true))
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:

            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back to the review queue"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - lblTitle:
                      Control: Text
                      Variant: Subtitle
                      Properties:
                        Text: ="Review"
                        TabIndex: =-1
                  - lblQueueCount:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: =Text(CountRows(galQueue.AllItems)) & " awaiting review"
                        Color: =clrTextSecondary
                        Live: =Live.Polite
                        TabIndex: =-1

            - conBody:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutWrap: =true
                  LayoutGap: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:

                  # --- the queue -------------------------------------------
                  - conQueue:
                      Control: GroupContainer
                      Variant: verticalAutoLayoutContainer
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =300
                        LayoutGap: =8
                        TabIndex: =-1
                      Children:
                        - galQueue:
                            Control: Gallery
                            Variant: verticalGallery
                            Properties:
                              # Delegable on indexed Is_Current and QC_Status.
                              Items: =MF_ReviewQueue()
                              TemplateSize: =84
                              Visible: =CountRows(Self.AllItems) > 0
                              AccessibleLabel: ="Submissions awaiting review"
                              TabIndex: =0
                            Children:
                              - conQueueRow:
                                  Control: GroupContainer
                                  Variant: verticalAutoLayoutContainer
                                  Properties:
                                    LayoutGap: =2
                                    PaddingTop: =8
                                    PaddingBottom: =8
                                    TabIndex: =-1
                                  Children:
                                    - lblQueueItem:
                                        Control: Text
                                        Variant: Body
                                        Properties:
                                          Text: =MF_ItemById(ThisItem.EOM_Item_ID).EOM_Item_Key
                                          FontWeight: =FontWeight.Semibold
                                          AutoHeight: =true
                                          TabIndex: =-1
                                    - lblQueueMeta:
                                        Control: Text
                                        Variant: Caption
                                        Properties:
                                          Text: |
                                            ="v" & ThisItem.Version_No &
                                             " - " & Text(ThisItem.Uploaded_DateTime, "d mmm hh:nn") &
                                             " - " & ThisItem.Uploaded_By.DisplayName &
                                             If(IsBlank(ThisItem.Submitted_On_Behalf_Of), "",
                                                " (on behalf of " & ThisItem.Submitted_On_Behalf_Of & ")")
                                          Color: =clrTextSecondary
                                          AutoHeight: =true
                                          TabIndex: =-1
                                    - btnOpenReview:
                                        Control: Button
                                        Variant: Secondary
                                        Properties:
                                          Text: ="Open"
                                          AccessibleLabel: ="Open version " & ThisItem.Version_No & " of " & MF_ItemById(ThisItem.EOM_Item_ID).EOM_Item_Key & " for review"
                                          OnSelect: |
                                            =Set(locSubmission, ThisItem);
                                             Set(locSelectedItem, MF_ItemById(ThisItem.EOM_Item_ID));
                                             Set(locQCVerdict, Blank());
                                             Set(locQCComment, "");
                                             Set(locCorrectionDue, Blank());
                                             Set(locQCError, "");
                                             SetFocus(lblDetailHeading)
                                          TabIndex: =0

                        - emptyQueue:
                            Control: Component
                            ComponentName: cmpEmptyState
                            Properties:
                              Visible: =CountRows(galQueue.AllItems) = 0
                              Title: ="Nothing awaiting review"
                              Body: ="Every current submission has been accepted or returned. New submissions appear here as they arrive."

                  # --- the document and the decision ------------------------
                  - conDetail:
                      Control: GroupContainer
                      Variant: verticalAutoLayoutContainer
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =320
                        LayoutGap: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        PaddingBottom: =16
                        Fill: =clrSurface
                        BorderThickness: =1
                        BorderColor: =clrBorder
                        Visible: =!IsBlank(locSubmission.Submission_ID)
                        TabIndex: =-1
                      Children:
                        - lblDetailHeading:
                            Control: Text
                            Variant: Subtitle
                            Properties:
                              Text: =LookUp('MF EOM Requirement', Requirement_ID = locSelectedItem.Requirement_ID).Document_Name
                              AutoHeight: =true
                              TabIndex: =0
                        - lblDetailMeta:
                            Control: Text
                            Variant: Caption
                            Properties:
                              Text: |
                                =locSelectedItem.Requirement_Scope & " - " & locSelectedItem.Reporting_Period &
                                 " - Required: " & If(locSelectedItem.Required_Flag, "Yes", "No") &
                                 " - Due " & Text(locSelectedItem.Nominal_Due_Date, "d mmm yyyy") &
                                 " - Received " & Text(locSelectedItem.Initial_Submitted_DateTime, "d mmm yyyy")
                              Color: =clrTextSecondary
                              AutoHeight: =true
                              TabIndex: =-1
                        - badgeCurrent:
                            Control: Component
                            ComponentName: cmpStatusBadge
                            Properties:
                              FinalStatus: =locSelectedItem.Final_Status
                              DueDate: =locSelectedItem.Nominal_Due_Date

                        - btnOpenDocument:
                            Control: Button
                            Variant: Secondary
                            Properties:
                              # The link describes the document, not "click
                              # here". Gate A6. The URL is re-resolved from
                              # SharePoint_File_ID by the flow, so a moved or
                              # renamed file still opens.
                              Text: ="Open document"
                              AccessibleLabel: ="Open " & locSubmission.File_Name & ", version " & locSubmission.Version_No & ", in a new tab"
                              OnSelect: =Launch(locSubmission.File_URL, {}, LaunchTarget.New)
                              TabIndex: =0
                        - lblFileName:
                            Control: Text
                            Variant: Caption
                            Properties:
                              Text: |
                                  ="File as submitted: " & locSubmission.File_Name & " (evidence only - never used to classify)"
                              Color: =clrTextSecondary
                              AutoHeight: =true
                              TabIndex: =-1

                        # --- version history, always visible ---------------
                        - lblVersionsHeading:
                            Control: Text
                            Variant: Body
                            Properties:
                              Text: ="Version history"
                              FontWeight: =FontWeight.Semibold
                              TabIndex: =-1
                        - galVersions:
                            Control: Gallery
                            Variant: verticalGallery
                            Properties:
                              # Nothing is ever overwritten. v1 Correction
                              # Required and v2 Accepted both persist.
                              Items: =MF_VersionsForItem(locSelectedItem.EOM_Item_ID)
                              TemplateSize: =56
                              AccessibleLabel: ="Version history, newest first"
                              TabIndex: =0
                            Children:
                              - lblVersionRow:
                                  Control: Text
                                  Variant: Caption
                                  Properties:
                                    Text: |
                                      ="v" & ThisItem.Version_No & "  " &
                                       Text(ThisItem.Uploaded_DateTime, "d mmm hh:nn") & "  " &
                                       ThisItem.Uploaded_By.DisplayName & "  " & ThisItem.QC_Status &
                                       If(ThisItem.Is_Current, "  (current)", "") &
                                       If(IsBlank(ThisItem.QC_Comment), "", "  - " & ThisItem.QC_Comment)
                                    Color: =If(ThisItem.Is_Current, clrText, clrTextSecondary)
                                    AutoHeight: =true
                                    TabIndex: =-1

                        # --- the decision -----------------------------------
                        - rdoVerdict:
                            Control: Radio
                            Properties:
                              # Seven verdicts. They behave like ticket tags: the
                              # engine collapses the four returning ones into
                              # RETURNED, and the base reads the specific reason.
                              Items: |
                                =["Accept", "Correction Required", "Incomplete",
                                  "Wrong Document", "Wrong Reporting Period",
                                  "Wrong Facility", "Not Applicable"]
                              OnChange: =Set(locQCVerdict, Self.Selected.Value); Set(locQCError, "")
                              AccessibleLabel: ="Review decision. Required."
                              DisplayMode: =MF_WriteMode
                              TabIndex: =0

                        - txtComment:
                            Control: TextInput
                            Variant: MultiLine
                            Properties:
                              # Progressive disclosure: only the verdicts that
                              # need a comment ask for one.
                              Visible: |
                                =locQCVerdict in ["Correction Required", "Incomplete",
                                                  "Wrong Document", "Wrong Reporting Period",
                                                  "Wrong Facility"]
                              Default: =locQCComment
                              OnChange: =Set(locQCComment, Self.Value)
                              HintText: ="What needs correcting, and how"
                              AccessibleLabel: ="Review comment. Required when returning a submission."
                              DisplayMode: =MF_WriteMode
                              TabIndex: =0

                        - dteCorrectionDue:
                            Control: DatePicker
                            Properties:
                              Visible: =locQCVerdict = "Correction Required"
                              DefaultDate: =locCorrectionDue
                              OnChange: =Set(locCorrectionDue, Self.SelectedDate)
                              AccessibleLabel: ="Correction suspense date. Required when returning a submission for correction."
                              DisplayMode: =MF_WriteMode
                              TabIndex: =0

                        - lblQCError:
                            Control: Text
                            Variant: Body
                            Properties:
                              Text: =locQCError
                              Color: =clrStatusRed
                              Visible: =!IsBlank(locQCError)
                              AutoHeight: =true
                              Live: =Live.Assertive
                              AccessibleLabel: ="Error. " & locQCError
                              TabIndex: =-1

                        - btnSaveReview:
                            Control: Button
                            Variant: Primary
                            Properties:
                              Text: ="Save review"
                              AccessibleLabel: ="Save the review decision for version " & locSubmission.Version_No
                              DisplayMode: =If(!gblCanWrite || !gblCanQC || IsBlank(locQCVerdict), DisplayMode.Disabled, DisplayMode.Edit)
                              TabIndex: =0
                              OnSelect: |
                                =If(
                                    locQCVerdict in ["Correction Required", "Incomplete",
                                                     "Wrong Document", "Wrong Reporting Period",
                                                     "Wrong Facility"]
                                        && IsBlank(Trim(locQCComment)),
                                        Set(locQCError, "Add a comment explaining what needs correcting."),
                                    locQCVerdict = "Correction Required" && IsBlank(locCorrectionDue),
                                        Set(locQCError, "Set a date for the corrected document."),
                                    !gblCanWrite,
                                        Set(locQCError, "The app is read-only while we finish maintenance."),

                                    // The QC verdict is an INPUT. The engine
                                    // decides the resulting status, in ONE
                                    // evaluation that writes all four fields.
                                    With(
                                        {
                                            qc: If(locQCVerdict = "Accept", "Accepted", locQCVerdict),
                                            item: locSelectedItem
                                        },
                                        With(
                                            {
                                                s: MF_EvaluateStatus(
                                                       Today(),
                                                       item.Effective_Due_Date,
                                                       item.Effective_Final_Call_Date,
                                                       item.Required_Flag,
                                                       item.Waived_Flag,
                                                       item.Authority_Status,
                                                       true,
                                                       qc
                                                   )
                                            },
                                            Patch('MF EOM Submission', locSubmission,
                                                { QC_Status: qc,
                                                  QC_By: gblCurrentUser,
                                                  QC_DateTime: Now(),
                                                  QC_Comment: locQCComment });

                                            Patch('MF EOM Item', item,
                                                { Final_Status:    s.status,
                                                  Status_Code:     s.code,
                                                  Action_Owner:    s.actionOwner,
                                                  Action_Required: s.actionRequired,
                                                  Correction_Due:  If(qc = "Correction Required",
                                                                      locCorrectionDue, Blank()) });

                                            Patch('MF EOM Audit', Defaults('MF EOM Audit'),
                                                { Audit_ID: "AUD-" & Text(Now(), "yyyymmddhhmmss"),
                                                  Entity_Type: "EOM_Submission",
                                                  Entity_ID: locSubmission.Submission_ID,
                                                  Action: "QC " & qc,
                                                  Actor_UPN: gblCurrentUser.Email,
                                                  Action_DateTime: Now(),
                                                  Old_Value: item.Final_Status,
                                                  New_Value: s.status,
                                                  Detail: locQCComment });

                                            Patch('MF App Event Log', Defaults('MF App Event Log'),
                                                MF_EventRow(
                                                    Switch(qc,
                                                        "Accepted", "QCAccepted",
                                                        "Correction Required", "QCCorrectionRequired",
                                                        "Wrong Document", "QCWrongDocument",
                                                        "QCAccepted"),
                                                    "Success",
                                                    locSubmission.Submission_ID, "", ""));

                                            Notify("Review saved. The item is now " & s.label & ".",
                                                   NotificationType.Success);
                                            Set(locSubmission, Blank())
                                        )
                                    )
                                )

                        - lblWrongDocNote:
                            Control: Text
                            Variant: Caption
                            Properties:
                              # Explain the behaviour, because it surprises
                              # reviewers who expect Wrong Document to be Red.
                              Text: |
                                ="Accept means you opened the file and verified it is the right document, complete and correct. This is substantive review, not presence checking." &
                                 If(locQCVerdict = "Wrong Document",
                                    Char(10) & "Wrong Document means the requirement is still unmet. Before the final call the item shows Not satisfied; after it, Overdue. It does not stay red forever.",
                                    "") &
                                 If(locQCVerdict in ["Correction Required", "Incomplete", "Wrong Reporting Period", "Wrong Facility"],
                                    Char(10) & "The base sees this specific reason, not a generic 'returned'.",
                                    "")
                              Color: =clrTextSecondary
                              Visible: =!IsBlank(locQCVerdict)
                              AutoHeight: =true
                              TabIndex: =-1
