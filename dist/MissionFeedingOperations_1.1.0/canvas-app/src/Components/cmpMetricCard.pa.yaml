# =============================================================================
# cmpMetricCard — one package figure.
#
# It reports a PACKAGE STATE and a count of packages, not a completion ratio.
# That is deliberate: a ratio quietly treats "not yet due" as either done or
# failing, and neither is true. The naive colour rollup sees [3, 4, 4], finds
# no 1 and no 2, and reports Complete when two requirements have not been filed.
#
# The card also carries the scope qualifier: a facility user must not be shown
# an installation figure derived from their neighbours' packages.
# =============================================================================

ComponentDefinitions:
  cmpMetricCard:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:

      Label:
        PropertyKind: Input
        DataType: Text
        Default: ="Package"

      Items:
        PropertyKind: Input
        Description: An already scope-filtered, delegably-filtered table. The component does not filter; it rolls up what it is given.
        DataType: Table
        Default: =Blank()

      ScopeQualifier:
        PropertyKind: Input
        Description: Non-blank when the figure covers less than the scope its label implies. Rendered as text, never hidden in a tooltip.
        DataType: Text
        Default: =""

      PackageState:
        PropertyKind: Output
        DataType: Text

    Properties:
      # The Output's formula lives here, like every other output.
      PackageState: =MF_PackageState(cmpMetricCard.Items)
      Height: =Self.conCard.Height
      Width: =Parent.Width

    Children:
      - conCard:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            LayoutGap: =4
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            Fill: =clrSurface
            BorderThickness: =1
            BorderColor: =clrBorder
            RadiusTopLeft: =6
            RadiusTopRight: =6
            RadiusBottomLeft: =6
            RadiusBottomRight: =6
            AccessibleLabel: |
              =cmpMetricCard.Label & ": " & MF_PackageLabel(cmpMetricCard.Items) & ". " &
              Text(CountRows(Filter(cmpMetricCard.Items, Final_Status = "ACCEPTED"))) & " of " &
              Text(CountRows(Filter(cmpMetricCard.Items, Final_Status <> "NOT_APPLICABLE"))) &
              " applicable requirements accepted." &
              If(IsBlank(cmpMetricCard.ScopeQualifier), "", " " & cmpMetricCard.ScopeQualifier)
            TabIndex: =-1
          Children:
            - lblMetricLabel:
                Control: Text
                Variant: Caption
                Properties:
                  Text: =cmpMetricCard.Label
                  Color: =clrTextSecondary
                  TabIndex: =-1
            - badgePackage:
                Control: Component
                ComponentName: cmpStatusBadge
                Properties:
                  # The package state reuses the chip so the same five visual
                  # states mean the same thing at every level.
                  FinalStatus: |
                    =Switch(
                        MF_PackageState(cmpMetricCard.Items),
                        "ACTION_REQUIRED", "OVERDUE",
                        "IN_REVIEW",       "RECEIVED_PENDING_QC",
                        "COMPLETE",        "ACCEPTED",
                        "IN_PROGRESS",     "NOT_DUE",
                        "NOT_APPLICABLE"
                    )
                  AccessibleLabelOverride: |
                      =cmpMetricCard.Label & ": " & MF_PackageLabel(cmpMetricCard.Items)
            - lblMetricDetail:
                Control: Text
                Variant: Caption
                Properties:
                  # Raw counts sit beside the state so a truncated query is
                  # visible rather than silent. See Delegation.fx.
                  Text: |
                    =With(
                        {
                            applicable: CountRows(Filter(cmpMetricCard.Items, Final_Status <> "NOT_APPLICABLE")),
                            accepted:   CountRows(Filter(cmpMetricCard.Items, Final_Status = "ACCEPTED"))
                        },
                        If(
                            applicable = 0,
                            "Nothing due this period",
                            Text(accepted) & " of " & Text(applicable) & " accepted"
                        )
                    )
                  Color: =clrTextSecondary
                  AutoHeight: =true
                  TabIndex: =-1
            - lblTruncationWarning:
                Control: Text
                Variant: Caption
                Properties:
                  Text: ="This result may be truncated. Report it - the figure above may be wrong."
                  Color: =clrStatusRed
                  Visible: =MF_TruncationSuspected(cmpMetricCard.Items)
                  AutoHeight: =true
                  Live: =Live.Polite
                  TabIndex: =-1
            - lblScopeQualifier:
                Control: Text
                Variant: Caption
                Properties:
                  Text: =cmpMetricCard.ScopeQualifier
                  Color: =clrTextSecondary
                  Visible: =!IsBlank(cmpMetricCard.ScopeQualifier)
                  AutoHeight: =true
                  TabIndex: =-1
