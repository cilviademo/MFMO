# =============================================================================
# scrUnmatched — Needs Classification.
#
# Confidence-first. The suggestions pre-select the dropdowns; they are never
# applied without a click, and the folder path and uploader are hints rather
# than decisions.
#
# NEVER INVENT A REQUIREMENT. Classifying a file here attaches it to an
# EXISTING expected item. There is no path on this screen that creates a
# checklist row, and if nothing matches, the answer is to say so and escalate —
# not to manufacture one.
#
# The queue should trend toward empty. A persistently large one means people
# are bypassing the app: a training problem, not an engineering one.
# =============================================================================

Screens:
  scrUnmatched:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Concurrent(
            Set(locUnmatched, Blank()),
            Set(locClassifyError, ""),
            Set(locClassifyInstallation, Blank()),
            Set(locClassifyFacility, Blank()),
            Set(locClassifyRequirement, Blank()),
            Set(locClassifyPeriod, locPeriod)
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: verticalAutoLayoutContainer
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            TabIndex: =-1
          Children:

            - conHeader:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =clrSurface
                  TabIndex: =-1
                Children:
                  - btnBack:
                      Control: Button
                      Variant: Subtle
                      Properties:
                        Text: ="Back"
                        AccessibleLabel: ="Back to home"
                        OnSelect: =Back(ScreenTransition.None)
                        TabIndex: =0
                  - lblTitle:
                      Control: Text
                      Variant: Subtitle
                      Properties:
                        Text: ="Needs classification"
                        TabIndex: =-1
                  - lblCount:
                      Control: Text
                      Variant: Caption
                      Properties:
                        Text: =Text(CountRows(galUnmatched.AllItems)) & " files"
                        Color: =clrTextSecondary
                        Live: =Live.Polite
                        TabIndex: =-1

            - conBody:
                Control: GroupContainer
                Variant: horizontalAutoLayoutContainer
                Properties:
                  FillPortions: =1
                  LayoutWrap: =true
                  LayoutGap: =16
                  PaddingLeft: =20
                  PaddingRight: =20
                  PaddingTop: =16
                  PaddingBottom: =16
                  TabIndex: =-1
                Children:

                  - galUnmatched:
                      Control: Gallery
                      Variant: verticalGallery
                      Properties:
                        Items: =MF_UnmatchedQueue()
                        TemplateSize: =96
                        FillPortions: =1
                        LayoutMinWidth: =300
                        Visible: =CountRows(Self.AllItems) > 0
                        AccessibleLabel: ="Files awaiting classification"
                        TabIndex: =0
                      Children:
                        - conRow:
                            Control: GroupContainer
                            Variant: verticalAutoLayoutContainer
                            Properties:
                              LayoutGap: =2
                              PaddingTop: =8
                              PaddingBottom: =8
                              TabIndex: =-1
                            Children:
                              - lblFileName:
                                  Control: Text
                                  Variant: Body
                                  Properties:
                                    Text: =ThisItem.File_Name
                                    FontWeight: =FontWeight.Semibold
                                    AutoHeight: =true
                                    TabIndex: =-1
                              - lblMeta:
                                  Control: Text
                                  Variant: Caption
                                  Properties:
                                    Text: |
                                      =Coalesce(ThisItem.Portfolio_ID, "unknown portfolio") & " - " &
                                       Coalesce(ThisItem.Fiscal_Year, "unknown FY") & " - " &
                                       "dropped " & Text(ThisItem.Discovered_DateTime, "d mmm") &
                                       " by " & ThisItem.Uploaded_By.DisplayName
                                    Color: =clrTextSecondary
                                    AutoHeight: =true
                                    TabIndex: =-1
                              - btnClassify:
                                  Control: Button
                                  Variant: Secondary
                                  Properties:
                                    Text: ="Classify"
                                    AccessibleLabel: ="Classify the file " & ThisItem.File_Name
                                    DisplayMode: =MF_WriteMode
                                    OnSelect: |
                                      =Set(locUnmatched, ThisItem);
                                       Set(locClassifyError, "");
                                       // Suggestions PRE-SELECT. They are never
                                       // applied without a click.
                                       Set(locClassifyInstallation, ThisItem.Suggested_Installation_ID);
                                       Set(locClassifyFacility, Blank());
                                       Set(locClassifyRequirement, Blank());
                                       SetFocus(lblResolveHeading)
                                    TabIndex: =0

                  - conResolve:
                      Control: GroupContainer
                      Variant: verticalAutoLayoutContainer
                      Properties:
                        FillPortions: =1
                        LayoutMinWidth: =320
                        LayoutGap: =12
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        PaddingBottom: =16
                        Fill: =clrSurface
                        BorderThickness: =1
                        BorderColor: =clrBorder
                        Visible: =!IsBlank(locUnmatched.Unmatched_ID)
                        TabIndex: =-1
                      Children:
                        - lblResolveHeading:
                            Control: Text
                            Variant: Subtitle
                            Properties:
                              Text: =locUnmatched.File_Name
                              AutoHeight: =true
                              TabIndex: =0

                        - lblConfidence:
                            Control: Text
                            Variant: Body
                            Properties:
                              # Confidence-first: say what we think and how
                              # sure we are, before showing the full cascade.
                              Text: |
                                =If(
                                    IsBlank(locUnmatched.Suggested_Installation_ID)
                                        && IsBlank(locUnmatched.Suggested_Document_Code),
                                    "We couldn't tell where this belongs. Pick it manually below.",
                                    "We think this belongs to " &
                                    Coalesce(
                                        LookUp('MF Installation',
                                               Installation_ID = locUnmatched.Suggested_Installation_ID).Installation_Name,
                                        "an unknown installation") &
                                    If(IsBlank(locUnmatched.Suggested_Document_Code), "",
                                       ", possibly " & locUnmatched.Suggested_Document_Code) &
                                    ". Confirm before applying - the folder and the uploader are hints, not facts."
                                )
                              Color: =clrText
                              AutoHeight: =true
                              Live: =Live.Polite
                              TabIndex: =-1

                        - btnOpenFile:
                            Control: Button
                            Variant: Subtle
                            Properties:
                              Text: ="Open the file"
                              AccessibleLabel: ="Open " & locUnmatched.File_Name & " in a new tab"
                              OnSelect: =Launch(locUnmatched.File_URL, {}, LaunchTarget.New)
                              TabIndex: =0
                        - lblDontGuess:
                            Control: Text
                            Variant: Caption
                            Properties:
                              Text: ="Do not classify from the filename. Open the file and confirm what it is."
                              Color: =clrTextSecondary
                              AutoHeight: =true
                              TabIndex: =-1

                        # Cascading: Installation -> Facility -> Requirement -> Period
                        - cmbInst:
                            Control: ComboBox
                            Properties:
                              Items: =MF_InstallationChoices
                              DisplayFields: =["Installation_Name"]
                              SelectMultiple: =false
                              DefaultSelectedItems: =Filter(MF_InstallationChoices, Installation_ID = locClassifyInstallation)
                              OnChange: =Set(locClassifyInstallation, Self.Selected.Installation_ID); Set(locClassifyFacility, Blank())
                              AccessibleLabel: ="Installation. Required."
                              TabIndex: =0
                        - cmbFac:
                            Control: ComboBox
                            Properties:
                              Items: =MF_FacilityChoices(locClassifyInstallation)
                              DisplayFields: =["Facility_Name"]
                              SelectMultiple: =false
                              OnChange: =Set(locClassifyFacility, Self.Selected.Facility_ID); Set(locClassifyRequirement, Blank())
                              AccessibleLabel: ="Facility. Required."
                              TabIndex: =0
                        - cmbReq:
                            Control: ComboBox
                            Properties:
                              # Filtered by the FACILITY's model and type, so a
                              # Food 2.0 cafe is never offered a legacy form.
                              Items: |
                                =With(
                                    { f: LookUp('MF Facility', Facility_ID = locClassifyFacility) },
                                    MF_RequirementChoices(f.Operating_Model, f.Facility_Type)
                                )
                              DisplayFields: =["Document_Name"]
                              SelectMultiple: =false
                              OnChange: =Set(locClassifyRequirement, Self.Selected.Requirement_ID)
                              AccessibleLabel: ="Document. Required."
                              TabIndex: =0
                        - cmbPeriod:
                            Control: ComboBox
                            Properties:
                              Items: =MF_SelectablePeriods
                              DisplayFields: =["Period"]
                              SelectMultiple: =false
                              DefaultSelectedItems: |
                                  =[{ Period: locClassifyPeriod }]
                              OnChange: =Set(locClassifyPeriod, Self.Selected.Period)
                              AccessibleLabel: ="Reporting period. Required."
                              TabIndex: =0

                        - lblNoMatch:
                            Control: Text
                            Variant: Body
                            Properties:
                              # The one thing this screen must never do.
                              Text: ="No expected item matches that selection. Do not invent a requirement - leave the file here and ask a Portfolio Manager whether the requirement should exist."
                              Color: =clrStatusAmber
                              Visible: |
                                =!IsBlank(locClassifyRequirement)
                                 && IsBlank(
                                        LookUp('MF EOM Item',
                                               Reporting_Period = locClassifyPeriod,
                                               Facility_ID = locClassifyFacility,
                                               Requirement_ID = locClassifyRequirement).EOM_Item_ID)
                              AutoHeight: =true
                              Live: =Live.Polite
                              TabIndex: =-1

                        - lblClassifyError:
                            Control: Text
                            Variant: Body
                            Properties:
                              Text: =locClassifyError
                              Color: =clrStatusRed
                              Visible: =!IsBlank(locClassifyError)
                              AutoHeight: =true
                              Live: =Live.Assertive
                              AccessibleLabel: ="Error. " & locClassifyError
                              TabIndex: =-1

                        - conActions:
                            Control: GroupContainer
                            Variant: horizontalAutoLayoutContainer
                            Properties:
                              LayoutGap: =8
                              LayoutWrap: =true
                              TabIndex: =-1
                            Children:
                              - btnApply:
                                  Control: Button
                                  Variant: Primary
                                  Properties:
                                    Text: ="Classify"
                                    AccessibleLabel: ="Attach " & locUnmatched.File_Name & " to the selected requirement"
                                    DisplayMode: |
                                      =If(
                                          !gblCanWrite || IsBlank(locClassifyRequirement)
                                              || IsBlank(LookUp('MF EOM Item',
                                                     Reporting_Period = locClassifyPeriod,
                                                     Facility_ID = locClassifyFacility,
                                                     Requirement_ID = locClassifyRequirement).EOM_Item_ID),
                                          DisplayMode.Disabled, DisplayMode.Edit)
                                    TabIndex: =0
                                    OnSelect: |
                                      =With(
                                          { item: LookUp('MF EOM Item',
                                                     Reporting_Period = locClassifyPeriod,
                                                     Facility_ID = locClassifyFacility,
                                                     Requirement_ID = locClassifyRequirement) },
                                          If(
                                              IsBlank(item.EOM_Item_ID),
                                              Set(locClassifyError, "That expected item no longer exists. Leave the file here and escalate."),
                                              With(
                                                  { nextVer: CountRows(MF_VersionsForItem(item.EOM_Item_ID)) + 1,
                                                    newId: "SUB-" & Text(Now(), "yyyymmddhhmmss") },
                                                  // Supersede, never overwrite.
                                                  UpdateIf('MF EOM Submission',
                                                      EOM_Item_ID = item.EOM_Item_ID && Is_Current = true,
                                                      { Is_Current: false, Superseded_By: newId });

                                                  Patch('MF EOM Submission', Defaults('MF EOM Submission'),
                                                      { Submission_ID: newId,
                                                        EOM_Item_ID: item.EOM_Item_ID,
                                                        Version_No: nextVer,
                                                        File_Name: locUnmatched.File_Name,
                                                        File_URL: locUnmatched.File_URL,
                                                        Uploaded_By: locUnmatched.Uploaded_By,
                                                        Uploaded_DateTime: locUnmatched.Discovered_DateTime,
                                                        Intake_Method: "Manual classification",
                                                        Classification_Method: "Manual",
                                                        Classification_Status: "Classified",
                                                        Classification_Confidence: "High",
                                                        Is_Current: true,
                                                        QC_Status: "Pending Review" });

                                                  With(
                                                      { s: MF_EvaluateStatus(Today(),
                                                               item.Effective_Due_Date,
                                                               item.Effective_Final_Call_Date,
                                                               item.Required_Flag, item.Waived_Flag,
                                                               item.Authority_Status, true, "Pending Review") },
                                                      Patch('MF EOM Item', item,
                                                          { Current_Submission_ID: newId,
                                                            Received_Flag: true,
                                                            Initial_Submitted_DateTime: locUnmatched.Discovered_DateTime,
                                                            Final_Status: s.status,
                                                            Status_Code: s.code,
                                                            Action_Owner: s.actionOwner,
                                                            Action_Required: s.actionRequired })
                                                  );

                                                  // The unmatched row is resolved, never deleted:
                                                  // the record that it arrived unclassified survives.
                                                  Patch('MF Unmatched File', locUnmatched,
                                                      { Resolution_Status: "Classified",
                                                        Resolved_Submission_ID: newId,
                                                        Resolved_By: gblCurrentUser,
                                                        Resolved_DateTime: Now() });

                                                  Patch('MF App Event Log', Defaults('MF App Event Log'),
                                                      MF_EventRow("ManualClassification", "Success", newId, "", ""));

                                                  Notify("Classified as version " & nextVer & ".", NotificationType.Success);
                                                  Set(locUnmatched, Blank())
                                              )
                                          )
                                      )
                              - btnNotEOM:
                                  Control: Button
                                  Variant: Secondary
                                  Properties:
                                    Text: ="Not an EOM document"
                                    AccessibleLabel: ="Mark " & locUnmatched.File_Name & " as not an EOM document"
                                    DisplayMode: =MF_WriteMode
                                    TabIndex: =0
                                    OnSelect: |
                                      =Patch('MF Unmatched File', locUnmatched,
                                          { Resolution_Status: "Not an EOM document",
                                            Resolved_By: gblCurrentUser,
                                            Resolved_DateTime: Now() });
                                       Notify("Marked as not an EOM document. The file itself is untouched.",
                                              NotificationType.Success);
                                       Set(locUnmatched, Blank())

                  - emptyUnmatched:
                      Control: Component
                      ComponentName: cmpEmptyState
                      Properties:
                        Visible: =CountRows(galUnmatched.AllItems) = 0
                        Title: ="Nothing to classify"
                        Body: ="Files submitted through the app are classified by declaration and never appear here. This queue only collects files dropped straight into a Portfolio folder."
