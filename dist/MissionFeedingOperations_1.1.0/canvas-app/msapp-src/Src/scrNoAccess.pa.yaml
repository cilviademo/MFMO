# =============================================================================
# scrNoAccess — no security mapping.
#
# There is no sign-in. On the network CAC identifies the user before the app
# loads, so reaching this screen does NOT mean "you are not logged in" — it
# means the identity is known and has no row in MF Security Mapping.
#
# Say that, because telling someone to sign in again when signing in is not the
# problem wastes an afternoon. An unmapped user gets a clear route to fix it,
# not an empty app.
# =============================================================================

Screens:
  scrNoAccess:
    Properties:
      Fill: =clrSurfaceAlt
      OnVisible: |
        =Patch(
            'MF App Event Log',
            Defaults('MF App Event Log'),
            MF_EventRow("PermissionDenied", "Warning", gblCurrentUser.Email,
                        "NO_SCOPE_MAPPING",
                        "Identity resolved but no active MF Security Mapping row")
        )

    Children:
      - conRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutJustifyContent: =LayoutJustifyContent.Center
            LayoutGap: =16
            PaddingLeft: =24
            PaddingRight: =24
            TabIndex: =-1
          Children:
            - lblHeading:
                Control: Text
                Variant: Subtitle1
                Properties:
                  Text: ="You don't have access yet"
                  Color: =clrText
                  Size: =24
                  Align: =Align.Center
                  AutoHeight: =true
                  TabIndex: =0
            - lblBody:
                Control: Text
                Variant: Body1
                Properties:
                  # Specific, and correct about the cause.
                  Text: |
                    ="You're signed in as " & gblCurrentUser.Email &
                     ". Your account isn't mapped to a facility yet. This isn't a sign-in problem, and signing in again won't change it."
                  Color: =clrText
                  Align: =Align.Center
                  AutoHeight: =true
                  LayoutMaxWidth: =560
                  Live: =Live.Polite
                  TabIndex: =-1
            - lblAction:
                Control: Text
                Variant: Body1
                Properties:
                  Text: |
                    ="Contact your Portfolio Manager" &
                     If(IsBlank(gblSupportContact), "", " or " & gblSupportContact) &
                     " and quote the address above."
                  Color: =clrText
                  Align: =Align.Center
                  AutoHeight: =true
                  LayoutMaxWidth: =560
                  TabIndex: =-1
            - btnRecheck:
                Control: Button
                Variant: Secondary
                Properties:
                  Text: ="Check again"
                  AccessibleLabel: ="Check again whether access has been granted"
                  OnSelect: =Refresh('MF Security Mapping'); Navigate(MF_StartScreen, ScreenTransition.None)
                  TabIndex: =0
