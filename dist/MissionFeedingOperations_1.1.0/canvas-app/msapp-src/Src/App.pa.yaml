# ============================================================================
# GENERATED by scripts/gen_msapp_source.py from canvas-app/src -- do not edit.
# canvas-app/src is the source of truth; regenerate rather than patch.
# ============================================================================
App:
  Properties:
    StartScreen: =MF_StartScreen
    OnStart: |
      =Concurrent(
          // One telemetry row per session. Business events, not clicks.
          Patch(
              'MF App Event Log',
              Defaults('MF App Event Log'),
              MF_EventRow(
                  If(gblCanEnterApp, "AppOpened", "MaintenanceModeBlocked"),
                  If(gblCanEnterApp, "Success", "Warning"),
                  "",
                  "",
                  ""
              )
          ),
          Set(locPeriod, gblOpenPeriod),
          Set(locSelectedItem, Blank()),
          Set(locSelectedInstallation, gblMyInstallation),
          Set(locSelectedFacility, gblMyFacility)
      )
    Formulas: |
      =// ---- App.Formulas.fx -------------------------------------------
      // =============================================================================
      // App.Formulas.fx — named formulas.
      //
      // Microsoft's current guidance: prefer named formulas over a bloated
      // App.OnStart. They evaluate lazily, recalculate when their inputs change, and
      // do not delay app start. Anything derived belongs here; OnStart keeps only
      // what genuinely cannot be expressed as a formula.
      //
      // Named formulas cannot ClearCollect. That is a feature here — it forces
      // server-side filtering instead of pulling lists into memory.
      //
      // Carried forward from V3 with the status functions removed: they now live in
      // StatusEngine.fx as ONE evaluation rather than three parallel switches.
      // =============================================================================


      // --- identity ------------------------------------------------------------
      // No sign-in. On the network CAC identifies the user before the app loads.
      // There is no login screen and no "welcome back" state; the app resolves
      // identity, scope and permissions from MF_Security_Mapping on open.
      gblCurrentUser = User();


      // --- configuration -------------------------------------------------------
      // No URL, site GUID or list name is hard-coded anywhere. Every value below is
      // read from MF_App_Config, which mirrors the environment variables so that
      // neither path is load-bearing alone.
      MF_ConfigRows = Filter('MF App Config', Active_Flag = true);

      MF_Config(Key: Text, Fallback: Text): Text =
          With( { row: LookUp(MF_ConfigRows, Config_Key = Key) },
                If(IsBlank(row.Config_Value), Fallback, row.Config_Value) );

      MF_ConfigNumber(Key: Text, Fallback: Number): Number =
          With( { v: MF_Config(Key, "") },
                If(IsBlank(v) || !IsNumeric(v), Fallback, Value(v)) );

      MF_ConfigBool(Key: Text, Fallback: Boolean): Boolean =
          Switch( Lower(MF_Config(Key, "")), "true", true, "false", false, Fallback );

      gblAppVersion     = MF_Config("AppVersion", "0.0.0-unconfigured");

      // --- schema compatibility ------------------------------------------------
      // THE SCHEMA VERSION THIS BUILD WAS COMPILED AGAINST. A literal, deliberately:
      // it is a property of the PACKAGE, not of the environment, and reading it from
      // the environment would make the check compare a value with itself.
      //
      // Bump it in the same commit as scripts/eom_schema.py SCHEMA_VERSION.
      // tests/test_schema_manifest.py fails if the two drift apart.
      MF_ExpectedSchemaVersion = "5.0";

      // What is actually deployed, from MF_App_Config. "unknown" when the config
      // list did not load -- which is itself a mismatch, not a pass.
      gblSchemaVersion  = MF_Config("SchemaVersion", "unknown");

      // A NEWER APP MUST NEVER WRITE AGAINST AN OLDER SCHEMA. It would patch columns
      // that do not exist yet -- which does not error in Power Apps, it writes
      // nothing -- and a document would read as submitted while nothing was
      // recorded. Every flow makes the same comparison independently; the app being
      // polite is not a control.
      gblSchemaMatches  = gblSchemaVersion = MF_ExpectedSchemaVersion;
      gblTenantCloud    = MF_Config("TenantCloud", "UNKNOWN");
      gblOpenPeriod     = MF_Config("OpenReportingPeriod", Text(DateAdd(Today(), -1, Months), "yyyy-mm"));
      gblFiscalYear     = MF_Config("CurrentFiscalYear", "");
      gblSupportMessage = MF_Config("SupportMessage", "Mission Feeding Operations is briefly unavailable for maintenance.");
      gblSupportContact = MF_Config("SupportContact", "");
      gblPowerBIURL     = MF_Config("PowerBIReportURL", "");

      // The kill switch. Both default FALSE: a configuration outage must not lock
      // every user out, and must not silently unlock writes either — the flows check
      // ReadOnlyMode independently, so FALSE here is safe.
      gblMaintenanceMode = MF_ConfigBool("MaintenanceMode", false);
      gblReadOnlyMode    = MF_ConfigBool("ReadOnlyMode", false);
      gblRequireQC       = MF_ConfigBool("RequireQC", true);

      MF_MaxUploadBytes  = MF_ConfigNumber("MaxUploadSizeMB", 50) * 1024 * 1024;

      // --- review queue ageing -------------------------------------------------
      // ONE number an admin can retune. The bands are DERIVED from it, so they can
      // never drift out of line with the threshold printed beside them -- which is
      // what happens when a developer hardcodes "0-1 / 2-3 / 4-5 / 6+" next to a
      // separate "aged 4 days or more" and somebody later changes one of them.
      gblReviewAgeDays   = MF_ConfigNumber("ReviewAgeHighlightDays", 4);

      MF_ReviewAgeBands =
          With( { n: gblReviewAgeDays },
              Table(
                  { Ord: 1, Low: 0,     High: n - 3, Late: false },
                  { Ord: 2, Low: n - 2, High: n - 1, Late: false },
                  { Ord: 3, Low: n,     High: n + 1, Late: true  },
                  { Ord: 4, Low: n + 2, High: Blank(), Late: true } ) );

      MF_ReviewAgeLabel(Days: Number): Text =
          With( { b: LookUp(MF_ReviewAgeBands,
                            Days >= Low && (IsBlank(High) || Days <= High)) },
              If( IsBlank(b), "",
                  IsBlank(b.High), $"{b.Low}+ days",
                  b.Low = b.High,  $"{b.Low} day",
                                   $"{b.Low}-{b.High} days" ) );

      // Ageing does NOT change the chip. An item awaiting review is yellow because
      // AFSVC owns it, and that comes from the status engine -- ageing is a fact
      // about the queue, not a status. It is drawn as emphasis on the ROW (weight
      // and a leading rule), never by recolouring the chip. A screen that recoloured
      // it would be a second status engine, which is how a status engine starts
      // lying.
      MF_ReviewIsAged(Days: Number): Boolean = Days >= gblReviewAgeDays;
      MF_DelegationWarnAt = MF_ConfigNumber("DelegationWarningThreshold", 2000);


      // --- scope ---------------------------------------------------------------
      // Delegable: filters on UPN, an indexed column, server-side.
      // Nobody is provisioned for their own base. CAC identifies the user, the GAL
      // gives their installation, and anyone at that installation may view and edit
      // its EOM submissions regardless of unit. INSTALLATION is the unit of access.
      //
      // WARNING: this filter is PRESENTATION. Power Apps Visible and Filter() are not
      // an access-control boundary — Microsoft is explicit that permissions
      // implemented in an app do not remove the user's permission to the underlying
      // data. The evidence library must enforce the same scope independently.
      // See docs/security-open-issue.md.
      gblMyScope =
          Filter('MF Security Mapping',
                 UPN = gblCurrentUser.Email,
                 Active_Flag = true);

      gblHasAccess = CountRows(MF_LiveScope) > 0;

      // Widest scope wins, ranked rather than alphabetical.
      gblScopeType =
          With( { s: MF_LiveScope },
              If( "Enterprise"   in s.Scope_Type, "Enterprise",
                  "Portfolio"    in s.Scope_Type, "Portfolio",
                  "Installation" in s.Scope_Type, "Installation",
                  "Facility"     in s.Scope_Type, "Facility",
                  "None" ) );

      gblRole = If("PORTFOLIO_MANAGER" in MF_LiveScope.Role, "PORTFOLIO_MANAGER", "BASE_USER");

      // An expired grant is not a grant. Requested access carries an expiry so a
      // departing member has a handover window, not permanent rights to a base they
      // left, and the app must honour it without waiting for a cleanup job.
      MF_LiveScope =
          Filter(gblMyScope, IsBlank(Expires_Date) || Expires_Date >= Today());

      gblCanQC       = CountRows(Filter(MF_LiveScope, Can_QC = true)) > 0;
      gblCanOnBehalf = CountRows(Filter(MF_LiveScope, Can_Submit_On_Behalf = true)) > 0;
      gblCanEditReqs = CountRows(Filter(MF_LiveScope, Can_Edit_Requirements = true)) > 0;
      gblCanGrant    = CountRows(Filter(MF_LiveScope, Can_Grant_Access = true)) > 0;
      gblGrantScope  = First(SortByColumns(Filter(MF_LiveScope, Can_Grant_Access = true),
                                           "Grant_Scope", SortOrder.Descending)).Grant_Scope;

      // Never granted by a role. Only by an explicit flag on the mapping row.
      gblIsDeveloper = CountRows(Filter(MF_LiveScope, Developer_Flag = true)) > 0;
      gblIsTester    = CountRows(Filter(MF_LiveScope, Tester_Flag = true))    > 0;

      gblMyPortfolio    = First(MF_LiveScope).Portfolio_ID;
      gblMyInstallation = First(MF_LiveScope).Installation_ID;
      gblMyFacility     = First(MF_LiveScope).Facility_ID;

      // Write access: read-only mode locks everyone except developers, and
      // maintenance mode locks everyone except developers and admins.
      // A schema mismatch disables writes for EVERYONE, developers included. Read-only
      // mode is an operational decision a developer may need to work around; a schema
      // mismatch is a statement that this build does not know the shape of the data,
      // and a developer writing anyway is exactly how it becomes unrecoverable.
      gblCanWrite     = gblSchemaMatches && (!gblReadOnlyMode || gblIsDeveloper);
      gblCanEnterApp  = !gblMaintenanceMode || gblIsDeveloper || gblCanEditReqs;

      MF_WriteMode    = If(gblCanWrite, DisplayMode.Edit, DisplayMode.Disabled);

      MF_ReadOnlyBanner =
          If( !gblSchemaMatches,
              "This version of the app does not match the data it is connected to. " &
              "Submitting is disabled until an administrator resolves it. " &
              "Nothing you have already submitted is affected.",
              gblReadOnlyMode,
              "The app is read-only while we finish maintenance. You can view status but not submit.",
              "" );

      // Admin-facing, and specific enough to act on. Never shown to a base user --
      // the two version strings are a deployment detail, not their problem.
      MF_SchemaMismatchDetail =
          If( gblSchemaMatches, "",
              $"CONFIGURATION_REQUIRED: this app expects schema {MF_ExpectedSchemaVersion}, " &
              $"MF_App_Config reports '{gblSchemaVersion}'. Either the lists were " &
              "provisioned from a different schema version, or MF_App_Config was not " &
              "reseeded after they were. Run provisioning/Seed-MFOpsConfiguration.ps1. " &
              "See docs/SHAREPOINT_SCHEMA_MANIFEST.md." );

      // The gate, evaluated before any screen renders. Unmapped users get a clear
      // route to fix it, not an empty app.
      MF_StartScreen =
          If( !gblHasAccess,      scrNoAccess,
              !gblCanEnterApp,    scrMaintenance,
              scrHome );
      // A schema mismatch does NOT bounce the user out. They keep read access to
      // their own status, which is the thing they came for and which is still true.
      // It is writing that stops.


      // --- feature flags -------------------------------------------------------
      // One published app carries released and unreleased screens at once. This is
      // what makes a single-environment tenant survivable. Do not copy the common
      // workaround of hand-renaming old and new screens.
      MF_FlagRows = 'MF Feature Flags';

      MF_IsFeatureOn(Key: Text): Boolean =
          With( { f: LookUp(MF_FlagRows, Feature_Key = Key) },
              If( IsBlank(f.Feature_Key), false,          // unknown flag is OFF
                  f.Enabled_Prod, true,
                  f.Enabled_Testers && (gblIsTester || gblIsDeveloper), true,
                  false ) );


      // --- scope-resolved reference data ---------------------------------------
      // Small tables, safe to hold. Everything transactional stays server-filtered.
      // Only onboarded bases generate expected items, so only onboarded bases have
      // anything to show. A base with Generation_Enabled FALSE is "not yet
      // onboarded", never "compliant".
      MF_MyInstallations =
          Switch( gblScopeType,
              "Enterprise", Filter('MF Installation', Active_Flag = true),
              "Portfolio",  Filter('MF Installation', Active_Flag = true, Portfolio_ID = gblMyPortfolio),
              Filter('MF Installation', Active_Flag = true, Installation_ID = gblMyInstallation) );

      MF_MyFacilities =
          Switch( gblScopeType,
              "Facility",     Filter('MF Facility', Active_Flag = true, Facility_ID = gblMyFacility),
              "Installation", Filter('MF Facility', Active_Flag = true, Installation_ID = gblMyInstallation),
              "Portfolio",    Filter('MF Facility', Active_Flag = true,
                                     Installation_ID in MF_MyInstallations.Installation_ID),
              Filter('MF Facility', Active_Flag = true) );

      // A DFAC manager with one facility row sees no dropdowns at all, just an
      // upload box. Everything else is the exception path.
      MF_ShowDropdowns = CountRows(MF_MyFacilities) > 1 || gblCanOnBehalf;

      // Last 13 periods, newest first. Reporting_Period is YYYY-MM throughout.
      MF_SelectablePeriods =
          ForAll( Sequence(13, 0, 1) As n,
              { Period: Text(DateAdd(Today(), -1 - n.Value, Months), "yyyy-mm") } );

      // Non-duty days in scope for this viewer. Small, and the same list the flow
      // resolves effective dates against, so the app and EOM-01 never disagree about
      // which Monday a suspense moved to.
      MF_MyNonDutyDays =
          Filter( 'MF Non Duty Day',
                  Active_Flag = true,
                  Scope_Type = "Enterprise"
                      || Scope_ID = gblMyInstallation
                      || Scope_ID = gblMyPortfolio );


      // --- navigation ----------------------------------------------------------
      // Role-shaped: three destinations for a facility user, six for an admin.
      // A feature flag removes the destination, not merely the button.
      colNavigation =
          Filter(
              Table(
                  { key: "home",     label: "Home",           screen: "scrHome",              flag: "",                need: "all"    },
                  // Was pointed at scrInstallation, the single-installation detail
                  // screen, because no package screen existed yet. It does now.
                  { key: "package",  label: "My Package",     screen: "scrMyPackage",         flag: "",                need: "all"    },
                  { key: "overview", label: "Overview",       screen: "scrOverview",          flag: "",                need: "qc"     },
                  { key: "installs", label: "Installations",  screen: "scrInstallations",     flag: "",                need: "qc"     },
                  { key: "except",   label: "Exceptions",     screen: "scrExceptions",        flag: "",                need: "qc"     },
                  // Submit is a PRIMARY ACTION, not a tab: BASE_TABS in the Figma
                  // build is exactly Home / My Package / Calendar, and every row
                  // action on scrHome and scrMyPackage already carries the item to
                  // scrUpload. A fourth tab was navigation drift.
                  { key: "review",   label: "Review",         screen: "scrReview",            flag: "EOM_QC",          need: "qc"     },
                  // Classification is reached from the Exceptions screen's rows
                  // (btnClassify -> scrUnmatched); a parallel tab duplicated it.
                  { key: "calendar", label: "Calendar",       screen: "scrCalendar",          flag: "EOM_CALENDAR",    need: "all"    },
                  // Activity is an AFSVC workspace tab (approved AFSVC set:
                  // Overview, Review, Installations, Exceptions, Activity, Admin).
                  { key: "activity", label: "Activity",       screen: "scrActivity",          flag: "",                need: "qc"     },
                  // Request access is a BUTTON on scrNoAccess in the approved
                  // design (NoAccess.tsx and ScopeUnresolved.tsx both reach it that
                  // way), never a tab. The screen stays; the tab goes.
                  { key: "admin",    label: "Admin",          screen: "scrAdminRequirements", flag: "EOM_ADMIN_REQS",  need: "admin"  },
                  { key: "diag",     label: "Diagnostics",    screen: "scrDiagnostics",       flag: "EOM_DIAGNOSTICS", need: "dev"    }
              ),
              (IsBlank(flag) || MF_IsFeatureOn(flag))
              && Switch( need,
                     "all",   true,
                     "write", gblCanWrite,
                     "qc",    gblCanQC,
                     "admin", gblCanEditReqs,
                     "grant", gblCanGrant,
                     "dev",   gblIsDeveloper,
                     false )
          );


      // --- colour tokens -------------------------------------------------------
      // Declared once. No screen may use a colour literal. Every ratio is verified by
      // tests/test_design_tokens.py and recorded in docs/accessibility.md.
      clrStatusBlue    = ColorValue("#0F548C");
      clrStatusBlueBg  = ColorValue("#EFF6FC");

      // AMBER AND YELLOW ARE THE WHOLE POINT OF SIX STATES, and they were 1.16:1
      // apart until this was fixed -- two near-identical browns telling a DFAC
      // manager that a document they filed on time and one they never sent are the
      // same kind of problem.
      //
      // Amber: the base still owes it and still has runway.   Amber is ORANGE.
      // Yellow: AFSVC has it and the base owes nothing.       Yellow is GOLD.
      //
      // They are 48 degrees apart in hue and dE2000 30 apart, which holds up under
      // deuteranopia, protanopia and tritanopia (dE 15-19). Luminance contrast
      // BETWEEN them is only 1.06:1 and cannot usefully be raised -- see
      // docs/accessibility.md -- so hue does the separating and the label and the
      // icon do the guaranteeing. Neither chip is ever colour alone.
      clrStatusAmber   = ColorValue("#944800");
      clrStatusAmberBg = ColorValue("#FFF3E6");
      clrStatusYellow  = ColorValue("#5A5800");
      clrStatusYellowBg = ColorValue("#FDFAE0");

      clrStatusRed     = ColorValue("#A4262C");
      clrStatusRedBg   = ColorValue("#FDF3F4");
      clrStatusGreen   = ColorValue("#0E700E");
      clrStatusGreenBg = ColorValue("#F1FAF1");
      clrStatusGray    = ColorValue("#424242");
      clrStatusGrayBg  = ColorValue("#F5F5F5");
      // The Figma --accent token. Was referenced by scrExceptions and DEFINED
      // NOWHERE -- an undefined token the reference checker missed because its
      // regex did not cover clr* names. Studio would have shown the error; the
      // parity pass caught it first.
      clrAccent        = ColorValue("#0F548C");
      clrText          = ColorValue("#242424");
      clrTextSecondary = ColorValue("#616161");
      clrSurface       = ColorValue("#FFFFFF");
      clrSurfaceAlt    = ColorValue("#FAF9F8");
      clrBorder        = ColorValue("#D1D1D1");
      clrFocus         = ColorValue("#0F6CBD");


      // --- telemetry -----------------------------------------------------------
      // Business events, not click tracking. Every row answers a question somebody
      // will ask about the programme.
      gblSessionId = GUID();

      MF_EventRow(EventType: Text, Result: Text, RecordId: Text, ErrorCode: Text, ErrorMessage: Text) =
          {
              Event_ID:        "EVT-" & Text(Now(), "yyyymmddhhmmss") & "-" & Text(gblSessionId),
              Event_DateTime:  Now(),
              User_UPN:        gblCurrentUser.Email,
              Role:            gblRole,
              Portfolio_ID:    gblMyPortfolio,
              Installation_ID: gblMyInstallation,
              Facility_ID:     gblMyFacility,
              Event_Type:      EventType,
              Record_ID:       RecordId,
              Result:          Result,
              Error_Code:      ErrorCode,
              Error_Message:   ErrorMessage,
              App_Version:     gblAppVersion
          };

      // ---- StatusEngine.fx -------------------------------------------
      // =============================================================================
      // StatusEngine.fx — the one status engine.
      //
      // Reference implementation:  scripts/status_engine.py
      // Server-side twin:          flows/EOM03-Reconciliation
      // Executable specification:  docs/mf-operations-prototype.html  itemStatus()
      // Held in agreement by:      tests/test_status_engine.py
      //
      // ONE evaluation returns the whole state object. Label, colour and action
      // ownership never diverge because they are never derived separately.
      //
      // This replaces the V3 App.Formulas.fx, which had StatusLabel(), StatusColor()
      // and StatusSemantic() as three parallel Switch statements over the numeric
      // code — and those three had already drifted from V3's own decision table.
      // See docs/handoffs/RECONCILIATION.md corrections C1-C3.
      //
      // Nothing about status is ever set by a human. There is no colour picker.
      // =============================================================================

      // Final_Status is the SEMANTIC string. Status_Code is the NUMERIC visual code.
      // Both are stored on MF_EOM_Item, written together, and neither is derived
      // from the other.
      MF_StatusResult := Type({
          status:         Text,       // Final_Status
          code:           Number,     // Status_Code, 0-4
          label:          Text,
          actionOwner:    Text,
          actionRequired: Boolean
      });

      // -----------------------------------------------------------------------------
      // The SIX visual codes.
      //
      // Colour carries OWNERSHIP and time risk, not severity:
      //
      //   Blue   4  not due, window open           nobody yet
      //   Amber  5  past the first suspense        the base, with runway
      //   Red    1  past the final call, returned  the base, out of runway
      //   Yellow 2  received, awaiting review      AFSVC
      //   Green  3  accepted                       nobody
      //   Gray   0  not applicable                 nobody
      //
      // The amber/yellow split is the point. Amber means TIME RISK; yellow means
      // SOMEBODY ELSE HAS IT. Collapsing them tells a DFAC manager that a document
      // they filed on time and one they never sent are the same kind of problem.
      //
      // Six is the ceiling. A seventh would stop being scannable.
      // -----------------------------------------------------------------------------
      MF_CodeNA     = 0;    // Gray
      MF_CodeRed    = 1;    // Red
      MF_CodeYellow = 2;    // Yellow
      MF_CodeGreen  = 3;    // Green
      MF_CodeBlue   = 4;    // Blue
      MF_CodeAmber  = 5;    // Amber

      // The nine semantic statuses. This table IS the mapping; it is not repeated in
      // a Switch() anywhere else in the app.
      MF_StatusCatalog =
          Table(
              { status: "NOT_APPLICABLE",      code: 0, label: "Not applicable",  actionOwner: "None",     actionRequired: false, rank: 9 },
              { status: "NOT_DUE",             code: 4, label: "Not due",         actionOwner: "Facility", actionRequired: false, rank: 7 },
              { status: "PENDING_VALIDATION",  code: 4, label: "Informational",   actionOwner: "Admin",    actionRequired: false, rank: 8 },
              { status: "LATE",                code: 5, label: "Late",            actionOwner: "Facility", actionRequired: true,  rank: 4 },
              { status: "OVERDUE",             code: 1, label: "Overdue",         actionOwner: "Facility", actionRequired: true,  rank: 1 },
              { status: "RETURNED",            code: 1, label: "Returned",        actionOwner: "Facility", actionRequired: true,  rank: 2 },
              { status: "NOT_SATISFIED",       code: 1, label: "Not satisfied",   actionOwner: "Facility", actionRequired: true,  rank: 3 },
              { status: "RECEIVED_PENDING_QC", code: 2, label: "Awaiting review", actionOwner: "Reviewer", actionRequired: true,  rank: 5 },
              { status: "ACCEPTED",            code: 3, label: "Accepted",        actionOwner: "None",     actionRequired: false, rank: 6 }
          );

      // The four verdicts that mean "it came back". The engine collapses them into
      // one RETURNED state; the base reads the specific reason off the submission.
      MF_ReturningVerdicts =
          ["Correction Required", "Incomplete", "Wrong Reporting Period", "Wrong Facility"];

      // Presentation from a stored Final_Status. This is what every gallery, badge and
      // detail pane calls. It is a LOOKUP, not a recomputation: the row already
      // carries the status, written by EOM-03 or by the app's own QC action.
      MF_Status(FinalStatus: Text): MF_StatusResult =
          With(
              { m: LookUp(MF_StatusCatalog, status = FinalStatus) },
              If(
                  IsBlank(m.status),
                  // An unknown status is a bug, not a state. Show it; do not hide it.
                  { status: FinalStatus, code: 0, label: "Unknown status",
                    actionOwner: "Admin", actionRequired: true },
                  { status: m.status, code: m.code, label: m.label,
                    actionOwner: m.actionOwner, actionRequired: m.actionRequired }
              )
          );

      // -----------------------------------------------------------------------------
      // The evaluation. Ordered, total, first match wins.
      //
      // Mirrors scripts/status_engine.py item_status() and the prototype's
      // itemStatus() branch for branch. Used in the app so a just-patched row renders
      // correctly before the nightly run; the authoritative write is EOM-03, so the
      // app and the flow can never disagree about a row that already exists.
      //
      // Reordering these branches changes behaviour. The tests assert the order.
      // -----------------------------------------------------------------------------
      MF_EvaluateStatus(
          Today: Date,
          EffectiveDueDate: Date,
          EffectiveFinalCallDate: Date,
          RequiredFlag: Boolean,
          WaivedFlag: Boolean,
          AuthorityStatus: Text,
          ReceivedFlag: Boolean,
          QCStatus: Text
      ): MF_StatusResult =
          MF_Status(
              With(
                  // A requirement with no final call is held to its first suspense.
                  { final: Coalesce(EffectiveFinalCallDate, EffectiveDueDate) },

              // 1. The obligation does not exist for this row this period.
              If( WaivedFlag || !RequiredFlag,
                  "NOT_APPLICABLE",

              // 2. A provisional requirement is informational, never adverse: the
              //    base has nothing to do and nothing is wrong. With eleven of
              //    thirteen requirements now VERIFIED against the AFSVC procedures
              //    deck this applies to almost nothing — a missed 1119 turns red as
              //    it should.
              (AuthorityStatus = "UNVERIFIED" || AuthorityStatus = "PROPOSED") && !ReceivedFlag,
                  "PENDING_VALIDATION",

              // 3-4. A verdict that ends the obligation.
              QCStatus = "Accepted",
                  "ACCEPTED",
              QCStatus = "Not Applicable",
                  "NOT_APPLICABLE",

              // 5. A recall is the submitter withdrawing BEFORE review, not a
              //    rejection. The item reverts to its date-based state and the
              //    withdrawn version stays in history as superseded.
              QCStatus = "Recalled",
                  MF_DateState(Today, EffectiveDueDate, final),

              // 6. Four verdicts, one status. The reason lives on the submission and
              //    is what the base reads — the engine does not need four states to
              //    say "it came back", and the submitter needs four reasons to know
              //    what to fix.
              QCStatus in MF_ReturningVerdicts,
                  "RETURNED",

              // 7-8. A wrong document does not stay Red by fiat: the requirement is
              //      still UNMET, and whether that is urgent depends on the suspense
              //      date rather than on the reviewer's verdict.
              QCStatus = "Wrong Document",
                  If( Today > final, "OVERDUE", "NOT_SATISFIED" ),

              // 9. Received and waiting on a reviewer. YELLOW: AFSVC owns it.
              ReceivedFlag,
                  "RECEIVED_PENDING_QC",

              // 10-12. Nothing received. Time decides, and the two suspenses split it.
                  MF_DateState(Today, EffectiveDueDate, final)
              ))
          );

      // Rules 10-12. The week between the two dates is the only one in the cycle
      // where a reminder still changes the outcome, so it gets its own state.
      //
      // ALWAYS evaluated against the EFFECTIVE dates. Reporting uses the nominal
      // ones, so "the 5th" stays the 5th in a leadership brief while the base is
      // held to a date they can actually meet.
      MF_DateState(Today: Date, EffectiveDue: Date, EffectiveFinal: Date): Text =
          If( IsBlank(EffectiveDue) || Today <= EffectiveDue, "NOT_DUE",
              IsBlank(EffectiveFinal) || Today <= EffectiveFinal, "LATE",
              "OVERDUE" );

      // -----------------------------------------------------------------------------
      // Package rollup — over SEMANTIC statuses, never over colour codes.
      //
      // The naive colour rollup sees [3, 4, 4], finds no 1 and no 2, and marks the
      // package Complete. It is IN PROGRESS: two requirements have not been filed.
      //
      // This replaces V3's MFRollup(), which was that naive colour rollup — on the
      // page below V3's own prose calling it wrong.
      // -----------------------------------------------------------------------------
      MF_PackageCatalog =
          Table(
              { state: "ACTION_REQUIRED", code: 1, label: "Action required" },
              { state: "IN_REVIEW",       code: 2, label: "In review" },
              { state: "COMPLETE",        code: 3, label: "Complete" },
              { state: "IN_PROGRESS",     code: 4, label: "In progress" },
              { state: "NOT_APPLICABLE",  code: 0, label: "Nothing due" }
          );

      // Items must already be filtered to what the viewer may see. A user scoped to
      // one DFAC must not receive an installation figure derived from their
      // neighbours' packages — see Delegation.fx MF_VisibleItems.
      MF_PackageState(Items: Table): Text =
          With(
              {
                  applicable: Filter(Items, Final_Status <> "NOT_APPLICABLE"),
                  adverse:    Filter(Items, Final_Status in ["OVERDUE", "RETURNED", "NOT_SATISFIED", "LATE"]),
                  inReview:   Filter(Items, Final_Status = "RECEIVED_PENDING_QC")
              },
              If( CountRows(applicable) = 0,           "NOT_APPLICABLE",
                  CountRows(adverse) > 0,              "ACTION_REQUIRED",
                  CountRows(inReview) > 0,             "IN_REVIEW",
                  // A provisional requirement neither completes a package nor blocks it.
                  With( { real: Filter(applicable, Final_Status <> "PENDING_VALIDATION") },
                      If( CountRows(real) > 0
                              && CountRows(Filter(real, Final_Status <> "ACCEPTED")) = 0,
                          "COMPLETE",
                          "IN_PROGRESS" )
                  )
              )
          );

      MF_PackageLabel(Items: Table): Text =
          LookUp(MF_PackageCatalog, state = MF_PackageState(Items)).label;

      MF_PackageCode(Items: Table): Number =
          LookUp(MF_PackageCatalog, state = MF_PackageState(Items)).code;

      // -----------------------------------------------------------------------------
      // Colour. Derived from the code and from nothing else.
      // Contrast ratios verified in docs/accessibility.md.
      // -----------------------------------------------------------------------------
      MF_StatusColor(Code: Number): Color =
          Switch( Code,
              MF_CodeGreen,  clrStatusGreen,
              MF_CodeYellow, clrStatusYellow,
              MF_CodeAmber,  clrStatusAmber,
              MF_CodeRed,    clrStatusRed,
              MF_CodeBlue,   clrStatusBlue,
              clrStatusGray
          );

      MF_StatusBackground(Code: Number): Color =
          Switch( Code,
              MF_CodeGreen,  clrStatusGreenBg,
              MF_CodeYellow, clrStatusYellowBg,
              MF_CodeAmber,  clrStatusAmberBg,
              MF_CodeRed,    clrStatusRedBg,
              MF_CodeBlue,   clrStatusBlueBg,
              clrStatusGrayBg
          );

      // The accessible sentence, built in one place. Status is never colour-only:
      // every chip carries its label, and a screen reader gets the whole sentence.
      MF_StatusAccessibleLabel(FinalStatus: Text, NominalDue: Date, EffectiveDue: Date): Text =
          With(
              { p: MF_Status(FinalStatus) },
              "Status: " & p.label & ". " &
              If( p.actionOwner = "None",
                  "No action required. ",
                  "Action owner: " & p.actionOwner & ". " ) &
              MF_DueDatePhrase(NominalDue, EffectiveDue)
          );

      // "Due 5 Sep (Mon 8 Sep)". Where the two differ the screen shows BOTH — a
      // nominal suspense landing on a Saturday cannot be the date someone is held
      // to, and burying that adjustment produces a monthly argument.
      MF_DueDatePhrase(NominalDue: Date, EffectiveDue: Date): Text =
          If( IsBlank(NominalDue),
              "",
              "Due " & Text(NominalDue, "d mmm") &
              If( IsBlank(EffectiveDue) || NominalDue = EffectiveDue,
                  "",
                  " (" & Text(EffectiveDue, "ddd d mmm") & ")" ) );

      // On-time is two questions and they are told to different audiences. NEVER
      // render these as two booleans.
      MF_OnTimePhrase(
          InitialSubmitted: DateTime, InitialOnTime: Boolean,
          AcceptableEvidence: DateTime, FinalOnTime: Boolean
      ): Text =
          Concatenate(
              If( IsBlank(InitialSubmitted), "",
                  "Submitted " & Text(InitialSubmitted, "d mmm") & " - " &
                  If(InitialOnTime, "on time", "after suspense") ),
              If( IsBlank(AcceptableEvidence), "",
                  Char(10) & "Accepted " & Text(AcceptableEvidence, "d mmm") & " - " &
                  If(FinalOnTime, "final evidence on time", "final evidence after suspense") )
          );

      // "Is this mine, or am I waiting on someone else?" Status_Code alone cannot
      // answer it — Amber covers both correction needed (the facility's action) and
      // awaiting review (AFSVC's). Home filters on ownership, not on colour.
      MF_IsMyAction(FinalStatus: Text): Boolean =
          With(
              { p: MF_Status(FinalStatus) },
              p.actionRequired &&
              Switch( p.actionOwner,
                  "Facility", gblScopeType = "Facility" || gblScopeType = "Installation",
                  "Reviewer", gblCanQC,
                  "Admin",    gblCanEditReqs,
                  false )
          );

      // What a BASE USER owes, independent of who is looking. The base-user preview
      // (EOM_PREVIEW_AS) must not filter through MF_IsMyAction: the previewing
      // manager holds Can_QC, which would leak reviewer-owned items into a list the
      // real base user would never see - a preview that shows the wrong list teaches
      // the wrong lesson.
      MF_IsBaseAction(FinalStatus: Text): Boolean =
          With( { p: MF_Status(FinalStatus) },
              p.actionRequired && p.actionOwner = "Facility" );

      // ---- Cascade.fx ------------------------------------------------
      // =============================================================================
      // Cascade.fx — the cascading reference-data sources.
      //
      // Requirements are driven by the FACILITY's operating model, never the
      // installation's. One base can run a legacy DFAC and a Food 2.0 cafe, and the
      // two generate different requirement sets.
      //
      // These are the drop boxes on the upload and classification screens. They ARE
      // MF EOM Requirement, filtered — there is no 'if Legacy then require 1119'
      // anywhere in the app, and changing a requirement next year is a list edit.
      // =============================================================================

      // Installations the viewer may see. Small; resolved in App.Formulas.
      MF_InstallationChoices =
          SortByColumns(MF_MyInstallations, "Installation_Name", SortOrder.Ascending);

      // Facilities at the selected installation, within the viewer's scope.
      MF_FacilityChoices(InstallationId: Text): Table =
          SortByColumns(
              Filter(MF_MyFacilities, Installation_ID = InstallationId),
              "Facility_Name", SortOrder.Ascending );

      // --- applicability, defined once -----------------------------------------
      // These two mirror model_applies() and facility_type_applies() in
      // scripts/generate_expected_items.py line for line, and
      // tests/test_duplication.py holds them to it. EOM-01 decides what is EXPECTED;
      // these decide what a user may FILE against. Different questions, deliberately
      // the same predicate -- a dropdown that offers a requirement EOM-01 would
      // never generate, or hides one it would, is a dropdown that argues with the
      // checklist beside it.

      // 'All' applies regardless of model. A facility with NO model -- the NO_DFAC
      // registry rows -- matches nothing: a base with no feeding facility owes no
      // 1119.
      MF_ModelApplies(ApplicableModel: Text, OperatingModel: Text): Boolean =
          !IsBlank(Trim(OperatingModel))
          && ( ApplicableModel = "All" || ApplicableModel = OperatingModel );

      // A blank REQUIREMENT list means every type. A blank FACILITY type means
      // unknown, and unknown MATCHES -- the QRG carries no facility type for any
      // row, so excluding on it would hide every type-scoped requirement from every
      // facility.
      //
      // The inline predicate this replaced got the blank-type case right only by
      // accident, and got a real type that is a substring of another wrong. See
      // docs/DUPLICATION_AUDIT.md for what it was and why it looked correct.
      //
      // Matching is on a DELIMITED EXACT TERM: both sides are wrapped in the
      // separator so ";MAF;" cannot match inside ";MAFFO;". Spaces around the
      // separators are normalised first, because the seed writes
      // "Main DFAC; Flight Kitchen" and a human editing the list will too.
      MF_FacilityTypeApplies(ApplicableTypes: Text, FacilityType: Text): Boolean =
          IsBlank(Trim(ApplicableTypes))
          || IsBlank(Trim(FacilityType))
          || With( { list: ";" & Substitute(Substitute(Trim(ApplicableTypes),
                                                       "; ", ";"), " ;", ";") & ";" },
                   (";" & Trim(FacilityType) & ";") in list );

      // Facility-scope requirements applicable to ONE facility's model and type.
      // Installation- and Contract-scope requirements are deliberately absent: they
      // belong on the installation screen, not in a facility's upload box, and
      // putting them here is how a DFAC manager ends up filing the base's SIK bill.
      //
      // DELEGATION: Active_Flag and Requirement_Scope are indexed and delegable, and
      // MF EOM Requirement holds ~13 rows -- three orders of magnitude below the
      // ceiling -- so the two applicability predicates run client-side without risk.
      // This is the ONLY place in the app where that is acceptable, and it is
      // acceptable only because the table is bounded by the requirement catalogue.
      MF_RequirementChoices(OperatingModel: Text, FacilityType: Text): Table =
          SortByColumns(
              Filter( Filter( 'MF EOM Requirement',
                              Active_Flag = true,
                              Requirement_Scope = "Facility" ),
                      MF_ModelApplies(Applicable_Model, OperatingModel),
                      MF_FacilityTypeApplies(Applicable_Facility_Types, FacilityType) ),
              "Sort_Order", SortOrder.Ascending );

      // Installation- and Contract-scope requirements for the installation screen.
      MF_SharedRequirementChoices(OperatingModels: Table): Table =
          SortByColumns(
              Filter( 'MF EOM Requirement',
                      Active_Flag = true,
                      Requirement_Scope <> "Facility" ),
              "Sort_Order", SortOrder.Ascending );

      // An unverified requirement still appears — people must be able to file
      // against it — but it renders dimmed with the reason available, and it can
      // never drive an adverse status. See StatusEngine.fx rule 2.
      MF_RequirementIsProvisional(RequirementId: Text): Boolean =
          LookUp('MF EOM Requirement', Requirement_ID = RequirementId).Authority_Status = "UNVERIFIED";

      MF_RequirementAuthorityNote(RequirementId: Text): Text =
          With( { r: LookUp('MF EOM Requirement', Requirement_ID = RequirementId) },
              If( r.Authority_Status = "UNVERIFIED",
                  "Provisional: " & Coalesce(r.Authority_Reference, "authority not yet confirmed") &
                  ". You can still file against it, and its absence is not a finding.",
                  Coalesce(r.Authority_Reference, "") ) );

      // On-behalf targets. Visible only to MFM, Portfolio Manager and Admin.
      // Without this an emailed document uploaded by AFSVC misattributes to AFSVC
      // and the missing/overdue counts go wrong silently.
      MF_OnBehalfChoices =
          If( gblCanOnBehalf,
              SortByColumns(MF_MyFacilities, "Facility_Name", SortOrder.Ascending),
              Blank() );

      // ---- Delegation.fx ---------------------------------------------
      // =============================================================================
      // Delegation.fx — patterns, anti-patterns, and every query this app is
      //                 allowed to run against a high-volume list.
      //
      // THE FAILURE THAT DOES NOT ANNOUNCE ITSELF
      //
      // A non-delegable query silently returns only the first 500 rows (2,000
      // maximum). It does not warn the user and it does not fail. It returns a WRONG
      // answer. A Portfolio Manager sees "3 overdue" when there are eleven, and
      // nobody finds out until an IG does.
      //
      // At 89 installations x facilities x requirements x 12 months, MF EOM Item
      // passes that ceiling inside the first year. MF EOM Audit and MF App Event Log
      // pass it sooner.
      //
      // So: every query below filters server-side on indexed columns, most selective
      // first, with Reporting_Period leading. The indexes are created by
      // provisioning/Provision-MFOpsLists.ps1 BEFORE any list crosses 5,000 items,
      // because SharePoint will not add one afterward.
      // =============================================================================


      // -----------------------------------------------------------------------------
      // WHAT DELEGATES TO SHAREPOINT
      //
      //   =  <>  <  <=  >  >=        on Text, Number, DateTime, Boolean
      //   And / Or / Not             (&&  ||  !)
      //   StartsWith                 on Text
      //   Filter, LookUp, Search
      //   SortByColumns              on a single indexed column
      //   CountRows                  only on an already-filtered delegable table
      //
      // WHAT DOES NOT
      //
      //   IsBlank() on a list column                <- the trap, see below
      //   Len / Left / Right / Mid / Upper / Lower / Trim
      //   Sum / Average / Max / Min / StdevP        on a SharePoint source
      //   GroupBy, AddColumns, Distinct, ShowColumns   (all client-side)
      //   ForAll over a data source
      //   Sort() (as distinct from SortByColumns)
      //   multi-column Search()
      //   a Choice column compared with = to a text literal without .Value
      //   any predicate the compiler cannot resolve to a constant
      // -----------------------------------------------------------------------------


      // -----------------------------------------------------------------------------
      // THE IsBlank TRAP — and why Facility_ID is null, not empty string.
      //
      // Installation- and Contract-scope rows carry a NULL Facility_ID. It has to be
      // null rather than "" because the two look identical in a gallery and behave
      // differently in every Filter():
      //
      //   IsBlank(Facility_ID)        NOT DELEGABLE. Silently truncates.
      //   Facility_ID = ""            does not match a true null in SharePoint.
      //
      // The delegable way to ask "is this a facility row" is to ask the question the
      // data actually models — the scope — on an indexed column:
      //
      //   Filter('MF EOM Item', Requirement_Scope = "Facility")     DELEGABLE
      //
      // That is why Requirement_Scope is denormalized onto the item at generation.
      // The same reasoning put Authority_Status there: rule 2 of the status engine
      // reads it, and a lookup to MF EOM Requirement would not delegate either.
      // -----------------------------------------------------------------------------


      // -----------------------------------------------------------------------------
      // ANTI-PATTERNS — every one of these has shipped somewhere and lied quietly.
      // -----------------------------------------------------------------------------
      //
      // BAD   ClearCollect( colAllItems, 'MF EOM Item' )
      //       The whole list. 500 rows of 250,000, with no indication. Every count
      //       downstream is wrong.
      //
      // BAD   Filter( 'MF EOM Item', Status_Code < 3 )
      //       Unbounded across every period ever generated. Add the period.
      // GOOD  Filter( 'MF EOM Item', Reporting_Period = locPeriod, Status_Code < 3 )
      //
      // BAD   Filter( 'MF EOM Item', IsBlank(Facility_ID) )
      //       Not delegable, and does not mean what it looks like.
      // GOOD  Filter( 'MF EOM Item', Requirement_Scope = "Installation" )
      //
      // BAD   Filter( 'MF EOM Item', Status_Code = MFItemStatusCode(...) )
      //       Computed comparison, non-delegable. This is why Status_Code is STORED.
      //
      // BAD   Filter( 'MF EOM Item', StartsWith(EOM_Item_Key, "LACKLAND") )
      //       StartsWith does not delegate on SharePoint. Filter on Installation_ID.
      //
      // BAD   CountRows(Filter('MF EOM Item', Final_Status <> "ACCEPTED"))
      //       Counts a truncated set and reports it as a total. This is the
      //       "3 overdue when there are eleven" failure exactly.
      //
      // BAD   ForAll( colFacilities, ForAll( colRequirements, Patch(...) ) )
      //       Nested ForAll. Microsoft warns explicitly; this belongs in EOM-01.
      //
      // BAD   Filter( 'MF EOM Item', Installation_ID = galParent.Selected.Installation_ID )
      //       Cross-screen control reference. Use a variable.
      //
      // BAD   a gallery bound to 'MF App Event Log' or 'MF EOM Audit'
      //       Append-only and unbounded. Query by Record_ID or Entity_ID only.
      // -----------------------------------------------------------------------------


      // -----------------------------------------------------------------------------
      // SECURITY BEFORE ROLLUP
      //
      // A facility-scoped user previously received an installation package rollup
      // computed from every facility at that base. That leaks across a security
      // boundary even when no names appear on screen — the numbers themselves are
      // the disclosure.
      //
      // Scope is applied server-side, in the query, before anything is counted. A
      // contract-scope item is visible only when the contract actually covers a
      // facility in the viewer's scope.
      // -----------------------------------------------------------------------------

      // Items for one facility and period. Bounded by construction — at most the
      // requirement count. Reporting_Period first, then the indexed facility.
      // SORTED BY THE EFFECTIVE DATE, not the nominal one. The nominal date is what
      // leadership is briefed on -- "the 5th" stays the 5th -- but the order a base
      // works its list in is the order the dates actually fall, and a suspense rolled
      // off a weekend falls later than one that did not. Sorting by nominal would put
      // two items with the same printed date in an order that contradicts when they
      // are really owed.
      //
      // `Due_Date` was the column here until the four-date split. It no longer
      // exists, and SortByColumns against a missing column does not error loudly.
      MF_ItemsForFacility(FacilityId: Text, Period: Text): Table =
          SortByColumns(
              Filter( 'MF EOM Item',
                      Reporting_Period = Period,
                      Facility_ID = FacilityId ),
              "Effective_Due_Date", SortOrder.Ascending );

      // Everything at one installation for a period, including the Installation- and
      // Contract-scope rows whose Facility_ID is null. Reached through
      // Installation_ID, never through IsBlank().
      MF_ItemsForInstallation(InstallationId: Text, Period: Text): Table =
          SortByColumns(
              Filter( 'MF EOM Item',
                      Reporting_Period = Period,
                      Installation_ID = InstallationId ),
              "Effective_Due_Date", SortOrder.Ascending );

      // Portfolio view. This is the query that would truncate if Portfolio_ID were
      // not denormalized onto the item — a join to MF Facility would be client-side.
      MF_ItemsForPortfolio(PortfolioId: Text, Period: Text): Table =
          Filter( 'MF EOM Item',
                  Reporting_Period = Period,
                  Portfolio_ID = PortfolioId );

      // The scope-correct item set for the current viewer. Every rollup starts here.
      // A Facility-scoped user gets their facility's rows plus the installation- and
      // contract-scope rows that genuinely belong to them.
      MF_VisibleItems(Period: Text): Table =
          Switch( gblScopeType,
              "Facility",
                  Filter( 'MF EOM Item',
                          Reporting_Period = Period,
                          Installation_ID = gblMyInstallation,
                          // Their own facility rows, plus the shared obligations of
                          // the installation. NOT their neighbours' facility rows.
                          ( Facility_ID = gblMyFacility
                            || Requirement_Scope = "Installation"
                            || Requirement_Scope = "Contract" ) ),
              "Installation",
                  Filter( 'MF EOM Item',
                          Reporting_Period = Period,
                          Installation_ID = gblMyInstallation ),
              "Portfolio",
                  Filter( 'MF EOM Item',
                          Reporting_Period = Period,
                          Portfolio_ID = gblMyPortfolio ),
              Filter( 'MF EOM Item', Reporting_Period = Period ) );

      // A contract row is only theirs if the contract covers one of their facilities.
      // Applied in memory over the already-scoped set above, which is bounded.
      MF_ContractItemIsMine(ContractId: Text): Boolean =
          IsBlank(ContractId)
          || CountRows(Filter(MF_MyFacilities, Contract_ID = ContractId)) > 0;

      // Health check: does this facility have any expected items at all for the
      // period? A facility with no requirement set is a configuration gap, not a
      // facility with nothing to do, and it sits silently green until something
      // looks for it.
      MF_HasItems(FacilityId: Text, Period: Text): Boolean =
          CountRows(MF_ItemsForFacility(FacilityId, Period)) > 0;

      // My work: what I owe, not what someone else owes. Action_Owner and
      // Action_Required are stored and indexed precisely so this delegates.
      MF_MyWork(Period: Text): Table =
          SortByColumns(
              Filter( MF_VisibleItems(Period), Action_Required = true ),
              "Effective_Due_Date", SortOrder.Ascending );

      // Waiting on someone else. A submitter's "needs your attention" list must not
      // contain documents sitting in AFSVC's review queue.
      MF_WaitingOnOthers(Period: Text): Table =
          Filter( MF_VisibleItems(Period),
                  Action_Required = true,
                  Action_Owner = "Reviewer" );

      // -----------------------------------------------------------------------------
      // Preview as a base user (EOM_PREVIEW_AS, view-only).
      //
      // A portfolio manager already READS every installation in scope, so rendering
      // one installation through the base-user screens discloses nothing new — this
      // is a presentation override, never an identity or permission change. The
      // preview NEVER submits: scrUpload refuses while gblPreviewInst is set, and
      // EOM-02 takes the caller's identity from the flow's authenticated context
      // regardless, so even a bypassed guard could not forge a submitter.
      //
      // These mirror MF_MyWork / MF_WaitingOnOthers / MF_PackageForPeriod exactly,
      // but scope through MF_ItemsForInstallation — the same indexed, delegable
      // query scrInstallation already uses — instead of the viewer's own mapping.
      // gblPreviewInst is a Set variable (named formulas cannot read those), so the
      // installation arrives as an argument from the call site.
      // -----------------------------------------------------------------------------
      MF_PreviewMyWork(InstallationId: Text, Period: Text): Table =
          SortByColumns(
              Filter( MF_ItemsForInstallation(InstallationId, Period),
                      Action_Required = true ),
              "Effective_Due_Date", SortOrder.Ascending );

      MF_PreviewWaiting(InstallationId: Text, Period: Text): Table =
          Filter( MF_ItemsForInstallation(InstallationId, Period),
                  Action_Required = true,
                  Action_Owner = "Reviewer" );

      MF_PreviewPackage(InstallationId: Text, Period: Text): Table =
          MF_ItemsForInstallation(InstallationId, Period);

      // The review queue. QC_Status and Is_Current are both indexed.
      MF_ReviewQueue(): Table =
          SortByColumns(
              Filter( 'MF EOM Submission',
                      Is_Current = true,
                      QC_Status = "Pending Review" ),
              "Uploaded_DateTime", SortOrder.Ascending );

      // Needs Classification. Reached by Resolution_Status, never by asking whether
      // a foreign key is blank.
      MF_UnmatchedQueue(): Table =
          SortByColumns(
              Filter( 'MF Unmatched File', Resolution_Status = "Needs Classification" ),
              "Discovered_DateTime", SortOrder.Ascending );

      // Version history for one item. EOM_Item_ID is indexed and this stays small.
      MF_VersionsForItem(ItemId: Text): Table =
          SortByColumns(
              Filter( 'MF EOM Submission', EOM_Item_ID = ItemId ),
              "Version_No", SortOrder.Descending );

      // One item by id, for a gallery row's OnSelect. Delegable and single-row.
      MF_ItemById(ItemId: Text): Record =
          LookUp('MF EOM Item', EOM_Item_ID = ItemId);

      // Activity for one record. Never an unfiltered read of the audit list.
      MF_ActivityForRecord(EntityId: Text): Table =
          SortByColumns(
              Filter('MF EOM Audit', Entity_ID = EntityId),
              "Action_DateTime", SortOrder.Descending );


      // -----------------------------------------------------------------------------
      // COUNTS
      //
      // Counting is where truncation hides. Only count a table a delegable Filter has
      // already bounded to one period and one scope, and display the row count beside
      // the figure so a truncation is visible rather than silent: if the gallery says
      // 500 and the count says 500, suspect truncation.
      // -----------------------------------------------------------------------------

      MF_TruncationSuspected(Items: Table): Boolean =
          CountRows(Items) >= MF_DelegationWarnAt;

      // A figure whose scope is narrower than its label says so, in text. It is never
      // silently narrowed and presented as the installation total.
      MF_ScopeQualifier(): Text =
          If( gblScopeType = "Facility",
              "Covers your facility and this installation's shared obligations, not the whole base.",
              "" );

      // =============================================================================
      // Helpers added for the approved screen set: scrMyPackage, scrOverview,
      // scrInstallations, scrExceptions.
      //
      // Every one of these starts from a query that delegates on indexed columns.
      // Where a predicate cannot delegate it is applied IN MEMORY over an
      // already-bounded result, and that is stated at the helper rather than left for
      // a reader to work out. The bound is always Reporting_Period plus scope, which
      // MF_VisibleItems has already applied server-side.
      // =============================================================================

      // One period's package for one installation, which is what scrMyPackage shows.
      // Delegates on Reporting_Period and Installation_ID, both indexed.
      MF_PackageForPeriod(Period: Text): Table =
          SortByColumns(
              MF_VisibleItems(Period),
              "Effective_Due_Date", SortOrder.Ascending );

      // Counts for the scrOverview metric strip. Final_Status is indexed, so each of
      // these delegates; CountRows over a delegable Filter does not pull rows.
      //
      // The four metrics are SEMANTIC, never colour. Amber covers both "the base owes
      // a correction" and "AFSVC owes a review", so counting by colour would put two
      // different people's work in one number.
      MF_CountAccepted(Period: Text): Number =
          CountRows(Filter(MF_VisibleItems(Period), Final_Status = "ACCEPTED"));

      MF_CountAwaitingReview(Period: Text): Number =
          CountRows(Filter(MF_VisibleItems(Period), Final_Status = "RECEIVED_PENDING_QC"));

      MF_CountCorrections(Period: Text): Number =
          CountRows(Filter(MF_VisibleItems(Period), Final_Status = "RETURNED"));

      MF_CountOverdue(Period: Text): Number =
          CountRows(Filter(MF_VisibleItems(Period),
                           Final_Status = "OVERDUE" || Final_Status = "NOT_SATISFIED"));

      // The installations this viewer may see, with their package rollup.
      // MF_MyInstallations is already scope-filtered in App.Formulas; the rollup runs
      // over that set, which is at most the 103-row registry and usually one row.
      MF_InstallationsInScope(Period: Text): Table =
          SortByColumns(
              AddColumns(
                  MF_MyInstallations,
                  "Pkg_Total",    CountRows(MF_ItemsForInstallation(Installation_ID, Period)),
                  "Pkg_Accepted", CountRows(Filter(MF_ItemsForInstallation(Installation_ID, Period),
                                                   Final_Status = "ACCEPTED")),
                  "Pkg_Open",     CountRows(Filter(MF_ItemsForInstallation(Installation_ID, Period),
                                                   Action_Required = true))
              ),
              "Installation_Name", SortOrder.Ascending );

      // EXCEPTIONS, three kinds. They are three different problems and must not read
      // as one number.

      // 1. Files the app did not write and nobody has classified.
      //    Resolution_Status is indexed. This is MF_UnmatchedQueue, reused.

      // 2. Submissions that landed at the configured root because no month folder
      //    matched. Is_Current and Needs_Filing are both indexed, so this delegates.
      //    Nothing errored when these were written -- that is exactly why they need
      //    a screen.
      MF_NeedsFilingQueue(): Table =
          SortByColumns(
              Filter( 'MF EOM Submission',
                      Is_Current = true,
                      Needs_Filing = true ),
              "Uploaded_DateTime", SortOrder.Ascending );

      // 3. Correction tickets past their suspense.
      //    DELEGATION NOTE: Correction_Due is NOT an indexed column, so the date
      //    comparison cannot delegate. The Filter that reaches SharePoint is
      //    MF_VisibleItems (Reporting_Period + scope, all indexed) narrowed by
      //    Final_Status (indexed); the date test then runs in memory over that
      //    bounded result. Adding an index for Correction_Due would be a schema
      //    change and is not made here.
      MF_CorrectionsPastDue(Period: Text): Table =
          Filter(
              Filter( MF_VisibleItems(Period), Final_Status = "RETURNED" ),
              !IsBlank(Correction_Due) && Correction_Due < Today() );

      MF_CorrectionsOpen(Period: Text): Table =
          Filter( MF_VisibleItems(Period), Final_Status = "RETURNED" );

      // Total exceptions across all three kinds, for the tab labels. Each part is
      // counted from its own delegable query.
      MF_ExceptionCount(Period: Text): Number =
          CountRows(MF_UnmatchedQueue())
          + CountRows(MF_NeedsFilingQueue())
          + CountRows(MF_CorrectionsPastDue(Period));
