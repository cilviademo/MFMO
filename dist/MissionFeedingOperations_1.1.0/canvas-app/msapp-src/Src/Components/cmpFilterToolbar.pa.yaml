# =============================================================================
# cmpFilterToolbar — search, portfolio, status, requirement, reset.
#
# Used by scrOverview, scrInstallations and scrExceptions. Three screens with
# three hand-built toolbars is three chances for one of them to filter on a
# column the others do not, and for two screens to disagree about the same
# question.
#
# EVERY OUTPUT IS A VALUE, NOT A QUERY. The component does not touch a data
# source: it emits the reader's choices and each screen applies them inside its
# own delegable Filter. A component that ran the query would decide delegation
# for screens it cannot see.
# =============================================================================

ComponentDefinitions:
  cmpFilterToolbar:
    DefinitionType: CanvasComponent
    CustomProperties:
      ShowPortfolio:
        PropertyKind: Input
        DisplayName: ShowPortfolio
        Description: >-
          Hidden for a Facility- or Installation-scoped viewer, who has exactly
          one portfolio and for whom the control is noise.
        DataType: Boolean
        Default: =false
      OnFilterChange:
        PropertyKind: Event
        DisplayName: OnFilterChange
        Description: Raised whenever any control changes.
        ReturnType: None
      SearchText:
        PropertyKind: Output
        DisplayName: SearchText
        DataType: Text
      PortfolioFilter:
        PropertyKind: Output
        DisplayName: PortfolioFilter
        Description: Blank means every portfolio in scope.
        DataType: Text
      StatusFilter:
        PropertyKind: Output
        DisplayName: StatusFilter
        Description: A Final_Status value, or blank for all.
        DataType: Text
      RequirementFilter:
        PropertyKind: Output
        DisplayName: RequirementFilter
        Description: A Requirement_ID, or blank for all.
        DataType: Text

    Properties:
      Height: =56
      Width: =840
      SearchText: =locSearch
      PortfolioFilter: =locPortfolio
      StatusFilter: =locStatus
      RequirementFilter: =locRequirement

    Children:
      - conToolbar:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutGap: =8
            LayoutWrap: =true
            LayoutAlignItems: =LayoutAlignItems.Center
            TabIndex: =-1
          Children:

            - txtSearch:
                Control: TextInput
                Properties:
                  HintText: ="Search"
                  LayoutMinWidth: =180
                  OnChange: |
                    =Set(locSearch, Self.Value);
                     cmpFilterToolbar.OnFilterChange()
                  AccessibleLabel: ="Search"
                  TabIndex: =0

            - cmbPortfolio:
                Control: ComboBox
                Properties:
                  Visible: =cmpFilterToolbar.ShowPortfolio
                  Items: =Distinct(MF_MyInstallations, Portfolio_ID)
                  SelectMultiple: =false
                  LayoutMinWidth: =150
                  OnChange: |
                    =Set(locPortfolio, Self.Selected.Value);
                     cmpFilterToolbar.OnFilterChange()
                  AccessibleLabel: ="Filter by portfolio"
                  TabIndex: =0

            - cmbStatus:
                Control: ComboBox
                Properties:
                  # The catalogue, not a literal list. One status vocabulary.
                  Items: =MF_StatusCatalog
                  DisplayFields: =["Label"]
                  SelectMultiple: =false
                  LayoutMinWidth: =170
                  OnChange: |
                    =Set(locStatus, Self.Selected.Status);
                     cmpFilterToolbar.OnFilterChange()
                  AccessibleLabel: ="Filter by status"
                  TabIndex: =0

            - cmbRequirement:
                Control: ComboBox
                Properties:
                  Items: =Filter('MF EOM Requirement', Active_Flag = true)
                  DisplayFields: =["Requirement_Name"]
                  SelectMultiple: =false
                  LayoutMinWidth: =200
                  OnChange: |
                    =Set(locRequirement, Self.Selected.Requirement_ID);
                     cmpFilterToolbar.OnFilterChange()
                  AccessibleLabel: ="Filter by requirement"
                  TabIndex: =0

            - btnReset:
                Control: Button
                Variant: Subtle
                Properties:
                  Text: ="Reset"
                  # One control clears everything. A reader who has narrowed to
                  # an empty result needs a way out that does not involve
                  # remembering which four controls they touched.
                  OnSelect: |
                    =Set(locSearch, "");
                     Set(locPortfolio, Blank());
                     Set(locStatus, Blank());
                     Set(locRequirement, Blank());
                     Reset(txtSearch);
                     Reset(cmbPortfolio);
                     Reset(cmbStatus);
                     Reset(cmbRequirement);
                     cmpFilterToolbar.OnFilterChange()
                  AccessibleLabel: ="Reset all filters"
                  TabIndex: =0
